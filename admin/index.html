<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>斗燈系統 · 文務後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1f2e;
    --ink-2: #2a3142;
    --paper: #f7f4ed;
    --paper-2: #ede8db;
    --gold: #c9a449;
    --gold-light: #e8c97a;
    --indigo: #3a4a6b;
    --indigo-light: #6c84b3;
    --vermillion: #b85450;
    --jade: #5a8a6b;
    --gray: #9aa0aa;
    --shadow: rgba(26, 31, 46, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    font-size: 15px;
    line-height: 1.5;
    letter-spacing: 0.02em;
  }

  .mono { font-family: 'JetBrains Mono', monospace; }

  /* === 登入 === */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(circle at 20% 20%, rgba(184, 84, 80, 0.08), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(58, 74, 107, 0.06), transparent 50%),
      var(--paper);
  }

  .login-card {
    width: 100%;
    max-width: 420px;
    background: white;
    border-radius: 4px;
    padding: 48px 32px;
    box-shadow: 0 24px 60px var(--shadow), 0 4px 16px rgba(26,31,46,0.08);
    position: relative;
  }

  .login-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--vermillion), var(--gold), var(--vermillion));
  }

  .login-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 28px;
    font-weight: 900;
    color: var(--ink);
    margin-bottom: 4px;
    letter-spacing: 0.08em;
  }

  .login-subtitle {
    font-size: 13px;
    color: var(--gray);
    margin-bottom: 32px;
    letter-spacing: 0.1em;
  }

  .form-label {
    display: block;
    font-size: 14px;
    color: var(--ink-2);
    font-weight: 500;
    margin-bottom: 6px;
  }

  .form-label.required::after {
    content: '*';
    color: var(--vermillion);
    margin-left: 4px;
  }

  .form-input,
  .form-select,
  .form-textarea {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    border: 1.5px solid #d4cfc1;
    border-radius: 4px;
    background: white;
    color: var(--ink);
    transition: border-color 0.2s;
  }

  .form-textarea {
    min-height: 80px;
    resize: vertical;
  }

  .form-input:focus,
  .form-select:focus,
  .form-textarea:focus {
    outline: none;
    border-color: var(--gold);
  }

  .btn-primary {
    width: 100%;
    padding: 14px;
    margin-top: 28px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 4px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 700;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: background 0.2s;
  }

  .btn-primary:hover { background: var(--ink-2); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .login-error {
    margin-top: 16px;
    padding: 12px;
    background: #fdf0ef;
    color: var(--vermillion);
    border-left: 3px solid var(--vermillion);
    font-size: 14px;
  }

  /* === 主畫面 === */
  .app { display: none; min-height: 100vh; }
  .app.active { display: block; }

  .header {
    background: var(--ink);
    color: var(--paper);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }

  .header-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 0.1em;
  }

  .header-title .divider {
    color: var(--vermillion);
    margin: 0 8px;
  }

  .btn-logout {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 6px 14px;
    border-radius: 3px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }

  /* === Tab === */
  .tabs {
    background: white;
    display: flex;
    border-bottom: 1px solid var(--paper-2);
    overflow-x: auto;
    position: sticky;
    top: 52px;
    z-index: 50;
  }

  .tab {
    flex: 1;
    min-width: 100px;
    padding: 14px 12px;
    font-size: 14px;
    color: var(--gray);
    text-align: center;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    font-weight: 500;
    white-space: nowrap;
  }

  .tab.active {
    color: var(--ink);
    border-bottom-color: var(--vermillion);
    font-weight: 700;
  }

  /* === 內容 === */
  .content {
    padding: 20px 16px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn 0.3s; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* === 表單卡片 === */
  .form-card {
    background: white;
    border-radius: 4px;
    padding: 24px;
    box-shadow: 0 2px 8px var(--shadow);
    margin-bottom: 16px;
  }

  .form-card-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--paper-2);
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }

  @media (min-width: 640px) {
    .form-grid { grid-template-columns: repeat(2, 1fr); }
    .form-grid .full { grid-column: 1 / -1; }
  }

  .form-row {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }

  .form-row .btn-primary { margin-top: 0; }

  .btn-secondary {
    background: var(--paper-2);
    color: var(--ink-2);
    border: 1.5px solid var(--paper-2);
    padding: 12px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
  }

  .btn-secondary:hover { background: white; }

  /* === 客戶列表 === */
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-box {
    flex: 1;
    min-width: 200px;
    position: relative;
  }

  .search-input {
    width: 100%;
    padding: 10px 14px 10px 38px;
    font-size: 14px;
    border: 1.5px solid var(--paper-2);
    border-radius: 4px;
    font-family: inherit;
    background: white;
  }

  .search-input:focus { outline: none; border-color: var(--gold); }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gray);
  }

  .filter-select {
    padding: 10px 12px;
    font-size: 14px;
    border: 1.5px solid var(--paper-2);
    border-radius: 4px;
    background: white;
    font-family: inherit;
    color: var(--ink-2);
  }

  /* === 表格 === */
  .data-table {
    background: white;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 2px 8px var(--shadow);
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  thead th {
    background: var(--paper);
    color: var(--ink-2);
    font-weight: 700;
    text-align: left;
    padding: 12px 14px;
    font-size: 13px;
    letter-spacing: 0.05em;
    border-bottom: 2px solid var(--paper-2);
    white-space: nowrap;
  }

  tbody td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--paper-2);
    color: var(--ink);
  }

  tbody tr:hover {
    background: var(--paper);
  }

  .table-actions {
    display: flex;
    gap: 6px;
    white-space: nowrap;
  }

  .btn-icon {
    padding: 6px 10px;
    font-size: 12px;
    border: 1px solid var(--paper-2);
    background: white;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink-2);
  }

  .btn-icon:hover { background: var(--paper); }
  .btn-icon.danger { color: var(--vermillion); border-color: rgba(184,84,80,0.3); }
  .btn-icon.danger:hover { background: rgba(184,84,80,0.08); }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    font-size: 11px;
    border-radius: 2px;
    font-weight: 500;
    letter-spacing: 0.05em;
  }

  .badge.gold { background: rgba(201,164,73,0.12); color: var(--gold); }
  .badge.jade { background: rgba(90,138,107,0.12); color: var(--jade); }
  .badge.gray { background: var(--paper-2); color: var(--gray); }
  .badge.vermillion { background: rgba(184,84,80,0.12); color: var(--vermillion); }

  /* === 空狀態 === */
  .empty {
    text-align: center;
    padding: 60px 24px;
    color: var(--gray);
  }

  .empty-icon {
    font-size: 48px;
    opacity: 0.3;
    margin-bottom: 12px;
    font-family: 'Noto Serif TC', serif;
  }

  /* === Modal === */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(26, 31, 46, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }

  .modal-backdrop.active { display: flex; }

  .modal {
    background: white;
    border-radius: 4px;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 24px 60px rgba(0,0,0,0.3);
  }

  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--paper-2);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
  }

  .modal-close {
    background: transparent;
    border: none;
    font-size: 22px;
    color: var(--gray);
    cursor: pointer;
    padding: 0 4px;
  }

  .modal-body { padding: 20px 24px; }

  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--paper-2);
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  /* === Toast === */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--ink);
    color: var(--paper);
    padding: 12px 24px;
    border-radius: 4px;
    font-size: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    transition: transform 0.3s;
    z-index: 2000;
  }

  .toast.active { transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--vermillion); }
  .toast.success { background: var(--jade); }

  .loading {
    text-align: center;
    padding: 40px 20px;
    color: var(--gray);
  }

  .loading::before {
    content: '◐';
    display: inline-block;
    margin-right: 8px;
    animation: rotate 1s linear infinite;
    color: var(--gold);
  }

  @keyframes rotate { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- ========== 登入 ========== -->
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <h1 class="login-title">文 務 後 台</h1>
    <p class="login-subtitle">斗 燈 系 統 · 管 理 介 面</p>

    <label class="form-label">密碼</label>
    <input type="password" id="password-input" class="form-input" placeholder="輸入密碼" autocomplete="off">

    <button id="login-btn" class="btn-primary">進 入 後 台</button>

    <div id="login-error" class="login-error" style="display:none;"></div>
  </div>
</div>

<!-- ========== 主程式 ========== -->
<div id="app" class="app">
  <header class="header">
    <div class="header-title">
      文 務<span class="divider">·</span>後 台
    </div>
    <button class="btn-logout" onclick="logout()">登出</button>
  </header>

  <nav class="tabs">
    <div class="tab active" data-tab="add-baonian">新增包年</div>
    <div class="tab" data-tab="add-doudeng">新增斗燈</div>
    <div class="tab" data-tab="manage-baonian">包年管理</div>
  </nav>

  <main class="content">

    <!-- 新增包年 -->
    <section id="panel-add-baonian" class="panel active">
      <div class="form-card">
        <div class="form-card-title">新增包年合約</div>
        <div class="form-grid">
          <div>
            <label class="form-label required">客戶ID</label>
            <input type="text" id="bn-customerId" class="form-input" placeholder="例：CJR-103">
          </div>
          <div>
            <label class="form-label required">客戶姓名</label>
            <input type="text" id="bn-name" class="form-input" placeholder="王小明">
          </div>
          <div>
            <label class="form-label required">所屬老師</label>
            <select id="bn-teacher" class="form-select">
              <option value="">— 選擇 —</option>
            </select>
          </div>
          <div>
            <label class="form-label required">月費</label>
            <select id="bn-fee" class="form-select" onchange="onFeeChange()">
              <option value="">— 選擇 —</option>
              <option value="2100">2,100（萬寶金1份）</option>
              <option value="3000">3,000（萬寶金1份+天赦金1份）</option>
              <option value="4200">4,200（萬寶金2份+贈年斗）</option>
            </select>
          </div>
          <div>
            <label class="form-label required">起始月份</label>
            <input type="month" id="bn-startMonth" class="form-input">
          </div>
          <div>
            <label class="form-label required">首付日期</label>
            <input type="date" id="bn-payDate" class="form-input">
          </div>
          <div id="gift-dou-wrap" style="display:none;">
            <label class="form-label">贈送年斗_斗種（4200才需選）</label>
            <select id="bn-giftDouType" class="form-select">
              <option value="">— 選擇 —</option>
              <option value="財神斗">財神斗</option>
              <option value="化煞斗">化煞斗</option>
              <option value="貴人斗">貴人斗</option>
              <option value="開運斗">開運斗</option>
              <option value="姻緣斗">姻緣斗</option>
              <option value="月老斗">月老斗</option>
            </select>
          </div>
          <div class="full">
            <label class="form-label">備註</label>
            <textarea id="bn-note" class="form-textarea" placeholder="可填特殊備註"></textarea>
          </div>
        </div>
        <div class="form-row">
          <button class="btn-secondary" onclick="resetBaonianForm()">清空</button>
          <button id="bn-submit" class="btn-primary" onclick="submitBaonian()">新 增 包 年</button>
        </div>
      </div>
    </section>

    <!-- 新增斗燈 -->
    <section id="panel-add-doudeng" class="panel">
      <div class="form-card">
        <div class="form-card-title">新增斗燈</div>
        <div class="form-grid">
          <div>
            <label class="form-label">客戶ID（選填）</label>
            <input type="text" id="dd-customerId" class="form-input" placeholder="若客戶有ID填入">
          </div>
          <div>
            <label class="form-label required">客戶姓名</label>
            <input type="text" id="dd-name" class="form-input">
          </div>
          <div>
            <label class="form-label required">所屬老師</label>
            <select id="dd-teacher" class="form-select">
              <option value="">— 選擇 —</option>
            </select>
          </div>
          <div>
            <label class="form-label required">斗種</label>
            <select id="dd-douType" class="form-select">
              <option value="">— 選擇 —</option>
              <option value="財神斗">財神斗</option>
              <option value="化煞斗">化煞斗</option>
              <option value="貴人斗">貴人斗</option>
              <option value="開運斗">開運斗</option>
              <option value="姻緣斗">姻緣斗</option>
              <option value="月老斗">月老斗</option>
            </select>
          </div>
          <div>
            <label class="form-label">架位編號</label>
            <input type="text" id="dd-position" class="form-input" placeholder="例：A-001">
          </div>
          <div>
            <label class="form-label required">類型</label>
            <select id="dd-type" class="form-select">
              <option value="">— 選擇 —</option>
              <option value="年斗">年斗（12個月）</option>
              <option value="季斗">季斗（3個月）</option>
              <option value="奇門年斗">奇門年斗</option>
              <option value="奇門季斗">奇門季斗</option>
            </select>
          </div>
          <div>
            <label class="form-label required">安斗月份</label>
            <input type="month" id="dd-startMonth" class="form-input">
          </div>
          <div class="full">
            <label class="form-label">備註</label>
            <textarea id="dd-note" class="form-textarea"></textarea>
          </div>
        </div>
        <div class="form-row">
          <button class="btn-secondary" onclick="resetDoudengForm()">清空</button>
          <button id="dd-submit" class="btn-primary" onclick="submitDoudeng()">新 增 斗 燈</button>
        </div>
      </div>
    </section>

    <!-- 包年管理 -->
    <section id="panel-manage-baonian" class="panel">
      <div class="toolbar">
        <div class="search-box">
          <span class="search-icon">⌕</span>
          <input id="mng-search" class="search-input" placeholder="搜尋 客戶ID / 姓名 / 老師" oninput="filterCustomers()">
        </div>
        <select id="mng-teacher-filter" class="filter-select" onchange="filterCustomers()">
          <option value="">全部老師</option>
        </select>
        <select id="mng-active-filter" class="filter-select" onchange="filterCustomers()">
          <option value="">全部狀態</option>
          <option value="是">生效中</option>
          <option value="否">未生效</option>
          <option value="已解約">已解約</option>
        </select>
        <button class="btn-icon" onclick="loadCustomers()">↻ 重新整理</button>
      </div>

      <div id="customers-table" class="data-table">
        <div class="loading">載入中...</div>
      </div>
    </section>

  </main>
</div>

<!-- 編輯 Modal -->
<div id="edit-modal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">編輯包年合約</div>
      <button class="modal-close" onclick="closeEdit()">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-rowIdx">
      <div class="form-grid">
        <div>
          <label class="form-label">客戶ID</label>
          <input type="text" id="edit-customerId" class="form-input">
        </div>
        <div>
          <label class="form-label">姓名</label>
          <input type="text" id="edit-name" class="form-input">
        </div>
        <div>
          <label class="form-label">老師</label>
          <select id="edit-teacher" class="form-select"></select>
        </div>
        <div>
          <label class="form-label">月費</label>
          <select id="edit-fee" class="form-select">
            <option value="2100">2,100</option>
            <option value="3000">3,000</option>
            <option value="4200">4,200</option>
          </select>
        </div>
        <div>
          <label class="form-label">起始月份</label>
          <input type="month" id="edit-startMonth" class="form-input">
        </div>
        <div>
          <label class="form-label">首付日期</label>
          <input type="date" id="edit-payDate" class="form-input">
        </div>
        <div>
          <label class="form-label">是否生效</label>
          <select id="edit-active" class="form-select">
            <option value="是">是</option>
            <option value="否">否</option>
            <option value="已解約">已解約</option>
          </select>
        </div>
        <div>
          <label class="form-label">贈送年斗</label>
          <select id="edit-giftDouType" class="form-select">
            <option value="">—</option>
            <option value="財神斗">財神斗</option>
            <option value="化煞斗">化煞斗</option>
            <option value="貴人斗">貴人斗</option>
            <option value="開運斗">開運斗</option>
            <option value="姻緣斗">姻緣斗</option>
            <option value="月老斗">月老斗</option>
          </select>
        </div>
        <div class="full">
          <label class="form-label">備註</label>
          <textarea id="edit-note" class="form-textarea"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeEdit()">取消</button>
      <button class="btn-primary" style="margin-top:0;width:auto;padding:12px 24px;" onclick="saveEdit()">儲 存 變 更</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  // ============================================
  const API_URL = 'https://script.google.com/macros/s/AKfycbzz9zWTST80TjzeYfc7S_8FbXAGjYbUu8QtJgu9Mf3WclA32pgF_WNHDyr9fXujKbov/exec';
  const TEACHERS = ['陳捷容', '蕭竣方', '陳彩綺', '周冠榮', '沈佳琪',
    '羅文勳', '蕭鎧峻', '鐘宥涵', '湯雯莉', '謝承殷',
    '林雅涵', '陳昕昀', '熊卿妃', '朱沛語', '靈應壇+員工',
    '賴素貞', '張簡玉靖', '梁凱妍', '鄭聖勳', '王宥心'];

  let currentPassword = '';
  let allCustomers = [];

  // ============================================
  // 初始化
  // ============================================
  document.addEventListener('DOMContentLoaded', () => {
    fillTeacherSelects();
    bindEvents();

    const saved = sessionStorage.getItem('adminPwd');
    if (saved) {
      currentPassword = saved;
      enterApp();
    }
  });

  function fillTeacherSelects() {
    const sels = ['bn-teacher', 'dd-teacher', 'edit-teacher', 'mng-teacher-filter'];
    sels.forEach(id => {
      const sel = document.getElementById(id);
      if (id === 'mng-teacher-filter') {
        TEACHERS.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t;
          opt.textContent = t;
          sel.appendChild(opt);
        });
      } else {
        TEACHERS.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t;
          opt.textContent = t;
          sel.appendChild(opt);
        });
      }
    });
  }

  function bindEvents() {
    document.getElementById('login-btn').addEventListener('click', login);
    document.getElementById('password-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });
    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => switchTab(t.dataset.tab));
    });
  }

  // ============================================
  // 登入
  // ============================================
  async function login() {
    const password = document.getElementById('password-input').value;
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';

    if (!password) { showLoginError('請輸入密碼'); return; }

    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.textContent = '驗證中...';

    try {
      const r = await api({ action: 'login', role: 'admin', password: password });
      if (!r.ok) {
        showLoginError(r.error || '登入失敗');
        btn.disabled = false;
        btn.textContent = '進 入 後 台';
        return;
      }
      currentPassword = password;
      sessionStorage.setItem('adminPwd', password);
      enterApp();
    } catch (err) {
      showLoginError('連線失敗：' + err.message);
      btn.disabled = false;
      btn.textContent = '進 入 後 台';
    }
  }

  function showLoginError(msg) {
    const el = document.getElementById('login-error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function logout() {
    sessionStorage.removeItem('adminPwd');
    currentPassword = '';
    document.getElementById('app').classList.remove('active');
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('password-input').value = '';
  }

  function enterApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('active');
    setDefaultDates();
  }

  function setDefaultDates() {
    const now = new Date();
    const ymStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    const ymdStr = ymStr + '-' + String(now.getDate()).padStart(2, '0');
    document.getElementById('bn-startMonth').value = ymStr;
    document.getElementById('bn-payDate').value = ymdStr;
    document.getElementById('dd-startMonth').value = ymStr;
  }

  // ============================================
  // Tab
  // ============================================
  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
    if (name === 'manage-baonian') loadCustomers();
  }

  // ============================================
  // 月費連動：4200 才顯示贈送年斗欄
  // ============================================
  function onFeeChange() {
    const fee = document.getElementById('bn-fee').value;
    document.getElementById('gift-dou-wrap').style.display = (fee === '4200') ? '' : 'none';
  }

  // ============================================
  // 新增包年
  // ============================================
  async function submitBaonian() {
    const data = {
      customerId: document.getElementById('bn-customerId').value.trim(),
      name: document.getElementById('bn-name').value.trim(),
      teacher: document.getElementById('bn-teacher').value,
      fee: document.getElementById('bn-fee').value,
      startMonth: document.getElementById('bn-startMonth').value,
      payDate: document.getElementById('bn-payDate').value,
      giftDouType: document.getElementById('bn-giftDouType').value,
      note: document.getElementById('bn-note').value.trim()
    };

    if (!data.customerId || !data.name || !data.teacher || !data.fee || !data.startMonth || !data.payDate) {
      return toast('請填寫必填欄位', 'error');
    }
    if (data.fee === '4200' && !data.giftDouType) {
      return toast('4200 包年必須選擇贈送年斗斗種', 'error');
    }

    const btn = document.getElementById('bn-submit');
    btn.disabled = true;
    btn.textContent = '新增中...';

    try {
      const r = await api({
        action: 'addBaonian',
        role: 'admin',
        password: currentPassword,
        payload: JSON.stringify(data)
      });
      if (!r.ok) { toast(r.error || '新增失敗', 'error'); return; }
      toast('✓ 新增成功（第 ' + r.data.rowIdx + ' 列）', 'success');
      resetBaonianForm();
    } catch (err) {
      toast('連線失敗：' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '新 增 包 年';
    }
  }

  function resetBaonianForm() {
    ['bn-customerId', 'bn-name', 'bn-note'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('bn-teacher').value = '';
    document.getElementById('bn-fee').value = '';
    document.getElementById('bn-giftDouType').value = '';
    document.getElementById('gift-dou-wrap').style.display = 'none';
    setDefaultDates();
  }

  // ============================================
  // 新增斗燈
  // ============================================
  async function submitDoudeng() {
    const data = {
      customerId: document.getElementById('dd-customerId').value.trim(),
      name: document.getElementById('dd-name').value.trim(),
      teacher: document.getElementById('dd-teacher').value,
      douType: document.getElementById('dd-douType').value,
      position: document.getElementById('dd-position').value.trim(),
      type: document.getElementById('dd-type').value,
      startMonth: document.getElementById('dd-startMonth').value,
      note: document.getElementById('dd-note').value.trim()
    };

    if (!data.name || !data.teacher || !data.douType || !data.type || !data.startMonth) {
      return toast('請填寫必填欄位', 'error');
    }

    const btn = document.getElementById('dd-submit');
    btn.disabled = true;
    btn.textContent = '新增中...';

    try {
      const r = await api({
        action: 'addDoudeng',
        role: 'admin',
        password: currentPassword,
        payload: JSON.stringify(data)
      });
      if (!r.ok) { toast(r.error || '新增失敗', 'error'); return; }
      toast('✓ 新增成功（編號 ' + r.data.no + '）', 'success');
      resetDoudengForm();
    } catch (err) {
      toast('連線失敗：' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '新 增 斗 燈';
    }
  }

  function resetDoudengForm() {
    ['dd-customerId', 'dd-name', 'dd-position', 'dd-note'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('dd-teacher').value = '';
    document.getElementById('dd-douType').value = '';
    document.getElementById('dd-type').value = '';
    setDefaultDates();
  }

  // ============================================
  // 包年管理（列表 + 編輯/刪除）
  // ============================================
  async function loadCustomers() {
    const wrap = document.getElementById('customers-table');
    wrap.innerHTML = '<div class="loading">載入中...</div>';

    try {
      const r = await api({
        action: 'getAllCustomers',
        role: 'admin',
        password: currentPassword
      });
      if (!r.ok) { wrap.innerHTML = '<div class="empty">' + r.error + '</div>'; return; }
      allCustomers = r.data;
      renderCustomers();
    } catch (err) {
      wrap.innerHTML = '<div class="empty">連線失敗：' + err.message + '</div>';
    }
  }

  function filterCustomers() {
    renderCustomers();
  }

  function renderCustomers() {
    const wrap = document.getElementById('customers-table');
    const kw = document.getElementById('mng-search').value.toLowerCase().trim();
    const tFilter = document.getElementById('mng-teacher-filter').value;
    const aFilter = document.getElementById('mng-active-filter').value;

    let list = allCustomers.slice();
    if (kw) {
      list = list.filter(c =>
        String(c.customerId).toLowerCase().includes(kw) ||
        String(c.name).toLowerCase().includes(kw) ||
        String(c.teacher).toLowerCase().includes(kw)
      );
    }
    if (tFilter) list = list.filter(c => c.teacher === tFilter);
    if (aFilter) list = list.filter(c => c.active === aFilter);

    if (!list.length) {
      wrap.innerHTML = '<div class="empty"><div class="empty-icon">○</div>查無資料</div>';
      return;
    }

    wrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>客戶ID</th>
            <th>姓名</th>
            <th>老師</th>
            <th>月費</th>
            <th>起始月</th>
            <th>狀態</th>
            <th>贈年斗</th>
            <th>動作</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(c => `
            <tr>
              <td class="mono" style="color:var(--gray);">${esc(c.customerId)}</td>
              <td><strong>${esc(c.name)}</strong></td>
              <td>${esc(c.teacher)}</td>
              <td class="mono">${num(c.fee)}</td>
              <td>${esc(c.startMonth)}</td>
              <td>${badge(c.active)}</td>
              <td>${c.giftDouType ? '<span class="badge gold">' + esc(c.giftDouType) + '</span>' : '—'}</td>
              <td class="table-actions">
                <button class="btn-icon" onclick="openEdit(${c.rowIdx})">編輯</button>
                <button class="btn-icon danger" onclick="deleteCustomer(${c.rowIdx}, '${esc(c.name).replace(/'/g, "\\'")}')">刪除</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  function badge(active) {
    if (active === '是') return '<span class="badge jade">生效中</span>';
    if (active === '已解約') return '<span class="badge vermillion">已解約</span>';
    return '<span class="badge gray">' + esc(active || '—') + '</span>';
  }

  // === 編輯 ===
  let editingCustomer = null;

  function openEdit(rowIdx) {
    const c = allCustomers.find(x => x.rowIdx === rowIdx);
    if (!c) return toast('找不到資料', 'error');
    editingCustomer = c;
    document.getElementById('edit-rowIdx').value = c.rowIdx;
    document.getElementById('edit-customerId').value = c.customerId || '';
    document.getElementById('edit-name').value = c.name || '';
    document.getElementById('edit-teacher').value = c.teacher || '';
    document.getElementById('edit-fee').value = c.fee || '';
    document.getElementById('edit-startMonth').value = c.startMonth || '';
    document.getElementById('edit-payDate').value = c.payDate || '';
    document.getElementById('edit-active').value = c.active || '是';
    document.getElementById('edit-giftDouType').value = c.giftDouType || '';
    document.getElementById('edit-note').value = c.note || '';
    document.getElementById('edit-modal').classList.add('active');
  }

  function closeEdit() {
    document.getElementById('edit-modal').classList.remove('active');
    editingCustomer = null;
  }

  async function saveEdit() {
    const rowIdx = parseInt(document.getElementById('edit-rowIdx').value);
    // 02 表欄位：1客戶ID 2姓名 3老師 4月費 6起始月 8首付日 12生效 13贈年斗 14備註
    const payload = {
      1: document.getElementById('edit-customerId').value.trim(),
      2: document.getElementById('edit-name').value.trim(),
      3: document.getElementById('edit-teacher').value,
      4: parseInt(document.getElementById('edit-fee').value),
      6: document.getElementById('edit-startMonth').value,
      8: document.getElementById('edit-payDate').value,
      12: document.getElementById('edit-active').value,
      13: document.getElementById('edit-giftDouType').value,
      14: document.getElementById('edit-note').value.trim()
    };

    try {
      const r = await api({
        action: 'updateRow',
        role: 'admin',
        password: currentPassword,
        sheetName: '02_包年合約台帳',
        row: rowIdx,
        payload: JSON.stringify(payload)
      });
      if (!r.ok) { toast(r.error || '更新失敗', 'error'); return; }
      toast('✓ 更新成功', 'success');
      closeEdit();
      loadCustomers();
    } catch (err) {
      toast('連線失敗：' + err.message, 'error');
    }
  }

  async function deleteCustomer(rowIdx, name) {
    if (!confirm('確定刪除「' + name + '」？\n\n刪除後 01 表的贈年斗也會自動清除。')) return;
    try {
      const r = await api({
        action: 'deleteRow',
        role: 'admin',
        password: currentPassword,
        sheetName: '02_包年合約台帳',
        row: rowIdx
      });
      if (!r.ok) { toast(r.error || '刪除失敗', 'error'); return; }
      toast('✓ 已刪除', 'success');
      loadCustomers();
    } catch (err) {
      toast('連線失敗：' + err.message, 'error');
    }
  }

  // ============================================
  // API
  // ============================================
  async function api(params) {
    const url = API_URL + '?' + new URLSearchParams(params).toString();
    const res = await fetch(url, { method: 'GET', redirect: 'follow' });
    return await res.json();
  }

  // ============================================
  // 工具
  // ============================================
  function esc(s) {
    if (s === undefined || s === null) return '';
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  function num(n) {
    if (!n) return '0';
    return Number(n).toLocaleString('zh-TW');
  }

  let toastTimer = null;
  function toast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast active ' + (type || '');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('active'), 3000);
  }
</script>
</body>
</html>
