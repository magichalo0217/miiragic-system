<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>斗燈系統 · 行政後台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-paper: #f5f0e6;
      --bg-card: #fffdf8;
      --bg-input: #fbf8f1;
      --ink: #2a2522;
      --ink-light: #6b6359;
      --ink-faint: #a89f93;
      --gold: #b8954e;
      --gold-deep: #8e7237;
      --crimson: #993333;
      --crimson-soft: #b85454;
      --line: #d8cdb8;
      --line-soft: #e8dfc9;
      --shadow: 0 1px 3px rgba(80, 60, 30, 0.08), 0 4px 12px rgba(80, 60, 30, 0.05);
    }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg-paper);
      color: var(--ink);
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.6;
    }
    .serif { font-family: 'Noto Serif TC', serif; }
    
    /* ========== 登入畫面 ========== */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--bg-card);
      padding: 48px 40px;
      box-shadow: var(--shadow);
      border-top: 3px solid var(--crimson);
    }
    .login-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 4px;
      margin-bottom: 4px;
    }
    .login-subtitle {
      font-size: 13px;
      color: var(--ink-light);
      letter-spacing: 4px;
      margin-bottom: 32px;
    }
    .form-label { display: block; font-size: 14px; color: var(--ink-light); margin-bottom: 8px; letter-spacing: 1px; }
    .form-input, .form-select {
      width: 100%; padding: 12px 16px;
      background: var(--bg-input); border: 1px solid var(--line);
      font-size: 15px; font-family: inherit; color: var(--ink); transition: border-color 0.15s;
    }
    .form-input:focus, .form-select:focus { outline: none; border-color: var(--gold); }
    .form-group { margin-bottom: 20px; }
    .btn { display: inline-block; padding: 12px 32px; background: var(--ink); color: var(--bg-card); border: none; font-family: inherit; font-size: 15px; letter-spacing: 4px; cursor: pointer; transition: background 0.15s; }
    .btn:hover { background: #444; }
    .btn-block { width: 100%; }
    .btn-gold { background: var(--gold); }
    .btn-gold:hover { background: var(--gold-deep); }
    .btn-crimson { background: var(--crimson); }
    .btn-crimson:hover { background: #7a2828; }
    .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .btn-ghost:hover { background: var(--bg-input); }
    .btn-sm { padding: 6px 16px; font-size: 13px; letter-spacing: 1px; }
    .error-msg { color: var(--crimson); font-size: 13px; margin-top: 12px; min-height: 20px; }
    
    /* ========== 主介面 ========== */
    #main-screen { display: none; }
    .topbar {
      background: var(--ink); color: var(--bg-paper);
      padding: 12px 32px; display: flex; justify-content: space-between; align-items: center;
    }
    .topbar-title { font-family: 'Noto Serif TC', serif; font-size: 16px; letter-spacing: 6px; }
    .topbar-right { display: flex; align-items: center; gap: 16px; font-size: 14px; }
    .logout-btn {
      padding: 4px 16px; border: 1px solid var(--crimson-soft); color: var(--crimson-soft);
      background: transparent; cursor: pointer; font-family: inherit; font-size: 13px; letter-spacing: 1px;
    }
    .logout-btn:hover { background: var(--crimson-soft); color: var(--ink); }
    
    .tabs {
      display: flex; background: var(--bg-card); border-bottom: 1px solid var(--line);
      padding: 0 32px; overflow-x: auto;
    }
    .tab {
      padding: 16px 24px; cursor: pointer; font-size: 15px; color: var(--ink-light);
      border-bottom: 2px solid transparent; transition: all 0.15s; white-space: nowrap;
    }
    .tab:hover { color: var(--ink); }
    .tab.active { color: var(--ink); border-bottom-color: var(--crimson); font-weight: 500; }
    
    .content { padding: 32px; max-width: 1400px; margin: 0 auto; }
    .panel { display: none; }
    .panel.active { display: block; }
    .panel-title { font-family: 'Noto Serif TC', serif; font-size: 22px; font-weight: 600; margin-bottom: 8px; }
    .panel-desc { color: var(--ink-light); font-size: 14px; margin-bottom: 24px; }
    
    .card { background: var(--bg-card); padding: 32px; box-shadow: var(--shadow); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-grid-full { grid-column: 1 / -1; }
    @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
    .form-actions { margin-top: 24px; display: flex; gap: 12px; justify-content: flex-end; }
    
    .id-display {
      padding: 12px 16px; background: #fff5e0; border: 1px solid var(--gold);
      color: var(--gold-deep); font-family: 'Courier New', monospace; font-weight: 600;
      font-size: 16px; letter-spacing: 2px;
    }
    .id-display.loading { color: var(--ink-faint); font-family: inherit; font-style: italic; font-weight: normal; letter-spacing: normal; }
    .id-display.empty { color: var(--ink-faint); font-family: inherit; font-style: italic; font-weight: normal; letter-spacing: normal; }
    
    /* ========== 卡片網格（客戶資料） ========== */
    .teacher-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .teacher-card {
      background: var(--bg-card);
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s;
      border-left: 3px solid transparent;
      box-shadow: var(--shadow);
      position: relative;
    }
    .teacher-card:hover { border-left-color: var(--gold); transform: translateY(-2px); }
    .teacher-card.active { border-left-color: var(--crimson); background: #fff8ed; }
    .teacher-card-name {
      font-family: 'Noto Serif TC', serif;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .teacher-card-stat {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 13px;
      color: var(--ink-light);
    }
    .teacher-card-stat .num {
      font-family: 'Noto Serif TC', serif;
      font-size: 24px;
      color: var(--ink);
      font-weight: 600;
    }
    .teacher-card-abbr {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: var(--gold-deep);
      letter-spacing: 1px;
      position: absolute;
      top: 12px;
      right: 16px;
    }
    
    .teacher-detail {
      background: var(--bg-card);
      padding: 24px 32px;
      box-shadow: var(--shadow);
      margin-top: 16px;
      display: none;
    }
    .teacher-detail.show { display: block; }
    .teacher-detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line-soft);
    }
    .teacher-detail-name {
      font-family: 'Noto Serif TC', serif;
      font-size: 22px;
      font-weight: 600;
    }
    
    /* 表格 */
    .data-table {
      width: 100%; background: var(--bg-card); border-collapse: collapse; box-shadow: var(--shadow);
    }
    .data-table th, .data-table td {
      padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--line-soft); font-size: 14px;
    }
    .data-table th {
      background: var(--bg-input); font-weight: 600; color: var(--ink-light); font-size: 13px; letter-spacing: 1px;
    }
    .data-table tr:hover td { background: #faf6ec; }
    .data-table .no-data { text-align: center; padding: 48px; color: var(--ink-faint); }
    .data-table .actions button {
      padding: 4px 10px; font-size: 12px; margin-right: 4px;
      background: transparent; border: 1px solid var(--line); cursor: pointer; font-family: inherit;
    }
    .data-table .actions button:hover { background: var(--bg-input); }
    .data-table .actions .delete:hover { background: var(--crimson); color: white; border-color: var(--crimson); }
    
    /* 統計卡片 */
    .stats-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .stat-card { background: var(--bg-card); padding: 20px 24px; border-left: 3px solid var(--gold); }
    .stat-card.crimson { border-left-color: var(--crimson); }
    .stat-label { font-size: 13px; color: var(--ink-light); letter-spacing: 1px; margin-bottom: 6px; }
    .stat-value { font-family: 'Noto Serif TC', serif; font-size: 28px; font-weight: 600; }
    
    .filter-row {
      display: flex; gap: 16px; align-items: center; margin-bottom: 24px;
      padding: 16px 24px; background: var(--bg-card); box-shadow: var(--shadow);
      flex-wrap: wrap;
    }
    .filter-row label { font-size: 14px; color: var(--ink-light); white-space: nowrap; }
    .filter-row input, .filter-row select {
      padding: 6px 12px; background: var(--bg-input); border: 1px solid var(--line);
      font-family: inherit; font-size: 14px;
    }
    
    .badge { display: inline-block; padding: 2px 10px; font-size: 12px; border-radius: 12px; letter-spacing: 1px; }
    .badge-active { background: #e8f0e0; color: #4a6e2e; }
    .badge-warn { background: #fff0e0; color: #b87737; }
    .badge-expire { background: #f0e0e0; color: var(--crimson); }
    
    .toast {
      position: fixed; top: 24px; right: 24px;
      padding: 16px 24px; background: var(--ink); color: var(--bg-card);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2); z-index: 100; max-width: 400px;
      transform: translateX(120%); transition: transform 0.3s ease;
    }
    .toast.show { transform: translateX(0); }
    .toast.success { background: #4a6e2e; }
    .toast.error { background: var(--crimson); }
    
    .empty-hint {
      text-align: center; padding: 60px 24px; color: var(--ink-faint); background: var(--bg-card);
    }
    .empty-hint .big { font-family: 'Noto Serif TC', serif; font-size: 32px; color: var(--ink-light); margin-bottom: 12px; }
    
    /* Modal */
    .modal-bg {
      display: none; position: fixed; top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; padding: 24px;
    }
    .modal-bg.show { display: flex; }
    .modal {
      background: var(--bg-card); max-width: 600px; width: 100%; padding: 32px;
      max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .modal-title {
      font-family: 'Noto Serif TC', serif; font-size: 22px; font-weight: 600; margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <!-- 登入畫面 -->
  <div id="login-screen">
    <div class="login-card">
      <h1 class="login-title">斗燈系統</h1>
      <p class="login-subtitle serif">行 政 後 台</p>
      <div class="form-group">
        <label class="form-label">密碼</label>
        <input type="password" id="password-input" class="form-input" placeholder="輸入密碼" autocomplete="off">
      </div>
      <button id="login-btn" class="btn btn-block btn-crimson">進　入</button>
      <p id="login-error" class="error-msg"></p>
    </div>
  </div>

  <!-- 主介面 -->
  <div id="main-screen">
    <div class="topbar">
      <div class="topbar-title">斗 燈 ・ 行政後台</div>
      <div class="topbar-right">
        <span>行政管理員</span>
        <button id="logout-btn" class="logout-btn">登出</button>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" data-panel="panel-customers">客戶資料</div>
      <div class="tab" data-panel="panel-add-baonian">＋ 新增包年</div>
      <div class="tab" data-panel="panel-add-doudeng">＋ 新增斗燈</div>
      <div class="tab" data-panel="panel-burn">本月燒化</div>
      <div class="tab" data-panel="panel-retire">本月撤斗</div>
      <div class="tab" data-panel="panel-trend">年度業績</div>
    </div>

    <div class="content">
      <!-- 客戶資料（卡片網格） -->
      <div id="panel-customers" class="panel active">
        <h2 class="panel-title">客戶資料</h2>
        <p class="panel-desc">點選老師卡片展開該老師的客戶清單。</p>
        <div id="teacher-grid" class="teacher-grid">
          <div class="empty-hint" style="grid-column:1/-1;">載入中...</div>
        </div>
        <div id="teacher-detail" class="teacher-detail"></div>
      </div>
      
      <!-- 新增包年 -->
      <div id="panel-add-baonian" class="panel">
        <h2 class="panel-title">新增包年合約</h2>
        <p class="panel-desc">替老師代填，請選擇所屬老師後系統自動產生客戶 ID。</p>
        <div class="card">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">所屬老師 *</label>
              <select id="bn-teacher" class="form-select">
                <option value="">— 選擇老師 —</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">客戶 ID（自動產生）</label>
              <div id="next-id-baonian" class="id-display empty">請先選擇老師</div>
            </div>
            <div class="form-group form-grid-full">
              <label class="form-label">客戶姓名 *</label>
              <input type="text" id="bn-name" class="form-input" placeholder="王小明">
            </div>
            <div class="form-group">
              <label class="form-label">月費 *</label>
              <select id="bn-fee" class="form-select">
                <option value="">— 選擇 —</option>
                <option value="2100">2,100</option>
                <option value="3000">3,000</option>
                <option value="4200">4,200</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">起始月份 *</label>
              <input type="month" id="bn-start" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label">首付日期 *</label>
              <input type="date" id="bn-pay" class="form-input">
            </div>
            <div class="form-group" id="gift-group" style="display:none;">
              <label class="form-label">贈送年斗（4,200 月費限定）*</label>
              <select id="bn-gift" class="form-select">
                <option value="">— 選擇 —</option>
                <option value="財神斗">財神斗</option>
                <option value="化煞斗">化煞斗</option>
                <option value="貴人斗">貴人斗</option>
                <option value="開運斗">開運斗</option>
                <option value="姻緣斗">姻緣斗</option>
              </select>
            </div>
            <div class="form-group form-grid-full">
              <label class="form-label">備註</label>
              <textarea id="bn-note" class="form-input" rows="2" placeholder="可填特殊備註"></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn btn-ghost" onclick="resetBaonianForm()">清空</button>
            <button class="btn btn-crimson" id="submit-baonian">新　增　包　年</button>
          </div>
        </div>
      </div>

      <!-- 新增斗燈 -->
      <div id="panel-add-doudeng" class="panel">
        <h2 class="panel-title">新增斗燈</h2>
        <p class="panel-desc">替老師代填，請選擇所屬老師後系統自動產生客戶 ID。</p>
        <div class="card">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">所屬老師 *</label>
              <select id="dd-teacher" class="form-select">
                <option value="">— 選擇老師 —</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">客戶 ID（自動產生）</label>
              <div id="next-id-doudeng" class="id-display empty">請先選擇老師</div>
            </div>
            <div class="form-group form-grid-full">
              <label class="form-label">客戶姓名 *</label>
              <input type="text" id="dd-name" class="form-input" placeholder="王小明">
            </div>
            <div class="form-group">
              <label class="form-label">斗種 *</label>
              <select id="dd-doutype" class="form-select">
                <option value="">— 選擇 —</option>
                <option value="財神斗">財神斗</option>
                <option value="化煞斗">化煞斗</option>
                <option value="貴人斗">貴人斗</option>
                <option value="開運斗">開運斗</option>
                <option value="姻緣斗">姻緣斗</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">類型 *</label>
              <select id="dd-type" class="form-select">
                <option value="">— 選擇 —</option>
                <option value="年斗">年斗</option>
                <option value="季斗">季斗</option>
                <option value="奇門年斗">奇門年斗</option>
                <option value="奇門季斗">奇門季斗</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">架位編號</label>
              <input type="text" id="dd-position" class="form-input" placeholder="如 A-001">
            </div>
            <div class="form-group">
              <label class="form-label">安斗月份 *</label>
              <input type="month" id="dd-start" class="form-input">
            </div>
            <div class="form-group form-grid-full">
              <label class="form-label">備註</label>
              <textarea id="dd-note" class="form-input" rows="2" placeholder="可填特殊備註"></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn btn-ghost" onclick="resetDoudengForm()">清空</button>
            <button class="btn btn-crimson" id="submit-doudeng">新　增　斗　燈</button>
          </div>
        </div>
      </div>

      <!-- 本月燒化 -->
      <div id="panel-burn" class="panel">
        <h2 class="panel-title">本月燒化（採購用）</h2>
        <p class="panel-desc">本月所有生效包年合約的萬寶金/天赦金總數，可作為採購依據。</p>
        <div class="filter-row">
          <label>查詢月份</label>
          <input type="month" id="burn-month">
          <label style="margin-left:16px;">老師（選填）</label>
          <select id="burn-teacher">
            <option value="">— 全部 —</option>
          </select>
          <button class="btn btn-ghost btn-sm" onclick="loadBurn()">查詢</button>
        </div>
        <div id="burn-stats" class="stats-row" style="display:none;"></div>
        <div id="burn-content"></div>
      </div>

      <!-- 本月撤斗 -->
      <div id="panel-retire" class="panel">
        <h2 class="panel-title">本月撤斗</h2>
        <p class="panel-desc">本月應該撤下的斗燈清單。</p>
        <div class="filter-row">
          <label>查詢月份</label>
          <input type="month" id="retire-month">
          <label style="margin-left:16px;">老師（選填）</label>
          <select id="retire-teacher">
            <option value="">— 全部 —</option>
          </select>
          <button class="btn btn-ghost btn-sm" onclick="loadRetire()">查詢</button>
        </div>
        <div id="retire-content"></div>
      </div>

      <!-- 年度業績 -->
      <div id="panel-trend" class="panel">
        <h2 class="panel-title">年度業績走勢</h2>
        <p class="panel-desc">查看單一老師的年度月份走勢。</p>
        <div class="filter-row">
          <label>老師</label>
          <select id="trend-teacher">
            <option value="">— 選擇 —</option>
          </select>
          <label style="margin-left:16px;">年份</label>
          <input type="number" id="trend-year" min="2024" max="2030" style="width:90px;">
          <button class="btn btn-ghost btn-sm" onclick="loadTrend()">查詢</button>
        </div>
        <div id="trend-content"></div>
      </div>
    </div>
  </div>

  <!-- 編輯 Modal -->
  <div id="edit-modal" class="modal-bg">
    <div class="modal">
      <div class="modal-title">編輯客戶</div>
      <div class="form-grid">
        <div class="form-group form-grid-full">
          <label class="form-label">客戶 ID</label>
          <input type="text" id="edit-cid" class="form-input" readonly style="background:#eee;">
        </div>
        <div class="form-group">
          <label class="form-label">客戶姓名</label>
          <input type="text" id="edit-name" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">月費</label>
          <select id="edit-fee" class="form-select">
            <option value="2100">2,100</option>
            <option value="3000">3,000</option>
            <option value="4200">4,200</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">起始月份</label>
          <input type="month" id="edit-start" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">首付日期</label>
          <input type="date" id="edit-pay" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">是否生效</label>
          <select id="edit-active" class="form-select">
            <option value="是">是</option>
            <option value="否">否</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">贈送年斗</label>
          <select id="edit-gift" class="form-select">
            <option value="">無</option>
            <option value="財神斗">財神斗</option>
            <option value="化煞斗">化煞斗</option>
            <option value="貴人斗">貴人斗</option>
            <option value="開運斗">開運斗</option>
            <option value="姻緣斗">姻緣斗</option>
          </select>
        </div>
        <div class="form-group form-grid-full">
          <label class="form-label">備註</label>
          <textarea id="edit-note" class="form-input" rows="2"></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="closeEditModal()">取消</button>
        <button class="btn btn-crimson" onclick="saveEdit()">儲　存</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbzz9zWTST80TjzeYfc7S_8FbXAGjYbUu8QtJgu9Mf3WclA32pgF_WNHDyr9fXujKbov/exec';
  
  const TEACHERS = ['陳捷容','蕭竣方','陳彩綺','周冠榮','沈佳琪','羅文勳','蕭鎧峻','鐘宥涵','湯雯莉','謝承殷','林雅涵','陳昕昀','熊卿妃','朱沛語','靈應壇+員工','賴素貞','張簡玉靖','梁凱妍','鄭聖勳','王宥心'];
  const TEACHER_ABBR_LOCAL = {'陳捷容':'CJR','蕭竣方':'HJF','陳彩綺':'CCQ','周冠榮':'ZGR','沈佳琪':'SJQ','羅文勳':'LWX','蕭鎧峻':'HKJ','鐘宥涵':'ZYH','湯雯莉':'TWL','謝承殷':'XCY','林雅涵':'LYH','陳昕昀':'CXY','熊卿妃':'XQF','朱沛語':'ZPY','靈應壇+員工':'LYT','賴素貞':'LSZ','張簡玉靖':'ZJYJ','梁凱妍':'LKY','鄭聖勳':'ZSX','王宥心':'WYX'};
  
  let currentPassword = '';
  let editingRow = null;
  let activeTeacher = null;
  
  async function api(params) {
    const url = API_URL + '?' + new URLSearchParams(params).toString();
    const res = await fetch(url, { method: 'GET', redirect: 'follow' });
    return await res.json();
  }
  
  function authedApi(params) {
    return api(Object.assign({ role: 'admin', password: currentPassword }, params));
  }
  
  function esc(s) {
    if (s === undefined || s === null) return '';
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }
  
  function num(n) { if (!n) return '0'; return Number(n).toLocaleString(); }
  
  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + (type || '');
    setTimeout(() => t.classList.remove('show'), 3000);
  }
  
  function todayMonth() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }
  function todayDate() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  
  // ========== 登入 ==========
  document.getElementById('login-btn').addEventListener('click', doLogin);
  document.getElementById('password-input').addEventListener('keypress', e => {
    if (e.key === 'Enter') doLogin();
  });
  
  async function doLogin() {
    const pw = document.getElementById('password-input').value;
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';
    if (!pw) { errEl.textContent = '請輸入密碼'; return; }
    
    try {
      const res = await api({ action: 'login', role: 'admin', password: pw });
      if (!res.ok) { errEl.textContent = res.error || '登入失敗'; return; }
      currentPassword = pw;
      enterMain();
    } catch (e) {
      errEl.textContent = '連線失敗：' + e.message;
    }
  }
  
  function enterMain() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'block';
    
    // 填老師選單
    ['bn-teacher','dd-teacher','burn-teacher','retire-teacher','trend-teacher'].forEach(id => {
      const sel = document.getElementById(id);
      TEACHERS.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t; opt.textContent = t;
        sel.appendChild(opt);
      });
    });
    
    // 預設值
    document.getElementById('bn-start').value = todayMonth();
    document.getElementById('bn-pay').value = todayDate();
    document.getElementById('dd-start').value = todayMonth();
    document.getElementById('burn-month').value = todayMonth();
    document.getElementById('retire-month').value = todayMonth();
    document.getElementById('trend-year').value = new Date().getFullYear();
    
    // 月費變化
    document.getElementById('bn-fee').addEventListener('change', e => {
      document.getElementById('gift-group').style.display = (e.target.value === '4200') ? 'block' : 'none';
      if (e.target.value !== '4200') document.getElementById('bn-gift').value = '';
    });
    
    // 老師選擇 → 取下一個 ID
    document.getElementById('bn-teacher').addEventListener('change', e => loadNextId('baonian', e.target.value));
    document.getElementById('dd-teacher').addEventListener('change', e => loadNextId('doudeng', e.target.value));
    
    // Tab 切換
    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        document.getElementById(t.dataset.panel).classList.add('active');
        if (t.dataset.panel === 'panel-customers') loadCustomers();
        if (t.dataset.panel === 'panel-burn') loadBurn();
        if (t.dataset.panel === 'panel-retire') loadRetire();
        if (t.dataset.panel === 'panel-trend') loadTrend();
      });
    });
    
    document.getElementById('submit-baonian').addEventListener('click', submitBaonian);
    document.getElementById('submit-doudeng').addEventListener('click', submitDoudeng);
    document.getElementById('logout-btn').addEventListener('click', () => location.reload());
    
    loadCustomers();
  }
  
  // ========== 客戶資料卡片網格 ==========
  async function loadCustomers() {
    const grid = document.getElementById('teacher-grid');
    grid.innerHTML = '<div class="empty-hint" style="grid-column:1/-1;">載入中...</div>';
    document.getElementById('teacher-detail').classList.remove('show');
    
    try {
      const res = await authedApi({ action: 'getCustomersByTeacher' });
      if (!res.ok) { grid.innerHTML = '<div class="empty-hint" style="grid-column:1/-1;">查詢失敗</div>'; return; }
      
      const grouped = res.data || {};
      let html = '';
      TEACHERS.forEach(t => {
        const customers = grouped[t] || [];
        const abbr = TEACHER_ABBR_LOCAL[t] || '';
        html += `<div class="teacher-card" onclick="showTeacherDetail('${esc(t)}')">
          <div class="teacher-card-abbr">${esc(abbr)}</div>
          <div class="teacher-card-name">${esc(t)}</div>
          <div class="teacher-card-stat">
            <span>包年客戶</span>
            <span class="num">${customers.length}</span>
          </div>
        </div>`;
      });
      grid.innerHTML = html;
      window._customersByTeacher = grouped;
    } catch (e) {
      grid.innerHTML = '<div class="empty-hint" style="grid-column:1/-1;">連線失敗：' + esc(e.message) + '</div>';
    }
  }
  
  function showTeacherDetail(teacher) {
    activeTeacher = teacher;
    
    // 高亮卡片
    document.querySelectorAll('.teacher-card').forEach(c => c.classList.remove('active'));
    event.currentTarget.classList.add('active');
    
    const customers = (window._customersByTeacher || {})[teacher] || [];
    const abbr = TEACHER_ABBR_LOCAL[teacher] || '';
    const detail = document.getElementById('teacher-detail');
    
    let html = `<div class="teacher-detail-header">
      <div>
        <div class="teacher-detail-name">${esc(teacher)} <span style="color:var(--gold-deep);font-family:'Courier New',monospace;font-size:14px;">（${esc(abbr)}）</span></div>
        <div style="color:var(--ink-light);font-size:13px;">共 ${customers.length} 位包年客戶</div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="closeTeacherDetail()">關閉</button>
    </div>`;
    
    if (customers.length === 0) {
      html += '<div class="empty-hint">該老師目前沒有包年客戶</div>';
    } else {
      html += '<table class="data-table"><thead><tr><th>客戶 ID</th><th>姓名</th><th>月費</th><th>起始</th><th>到期</th><th>萬寶/天赦</th><th>狀態</th><th>贈年斗</th><th>備註</th><th></th></tr></thead><tbody>';
      customers.forEach(c => {
        const status = c.active === '是' 
          ? '<span class="badge badge-active">生效</span>' 
          : '<span class="badge badge-warn">未生效</span>';
        html += `<tr>
          <td><strong>${esc(c.customerId)}</strong></td>
          <td>${esc(c.name)}</td>
          <td>${num(c.fee)}</td>
          <td>${esc(c.startMonth)}</td>
          <td>${esc(c.endMonth)}</td>
          <td>${num(c.wbj)} / ${num(c.tsj)}</td>
          <td>${status}</td>
          <td>${esc(c.giftDouType)}</td>
          <td style="font-size:12px;">${esc(c.note)}</td>
          <td class="actions">
            <button onclick="openEditModal(${c.rowIdx}, ${JSON.stringify(c).replace(/"/g, '&quot;')})">編輯</button>
            <button class="delete" onclick="confirmDelete(${c.rowIdx}, '${esc(c.name)}')">刪除</button>
          </td>
        </tr>`;
      });
      html += '</tbody></table>';
    }
    
    detail.innerHTML = html;
    detail.classList.add('show');
    detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  
  function closeTeacherDetail() {
    document.getElementById('teacher-detail').classList.remove('show');
    document.querySelectorAll('.teacher-card').forEach(c => c.classList.remove('active'));
  }
  
  // ========== 編輯與刪除 ==========
  function openEditModal(rowIdx, c) {
    editingRow = rowIdx;
    document.getElementById('edit-cid').value = c.customerId || '';
    document.getElementById('edit-name').value = c.name || '';
    document.getElementById('edit-fee').value = c.fee || '';
    document.getElementById('edit-start').value = c.startMonth || '';
    document.getElementById('edit-pay').value = c.payDate || '';
    document.getElementById('edit-active').value = c.active || '是';
    document.getElementById('edit-gift').value = c.giftDouType || '';
    document.getElementById('edit-note').value = c.note || '';
    document.getElementById('edit-modal').classList.add('show');
  }
  
  function closeEditModal() {
    document.getElementById('edit-modal').classList.remove('show');
    editingRow = null;
  }
  
  async function saveEdit() {
    if (!editingRow) return;
    const payload = {
      2: document.getElementById('edit-name').value.trim(),
      4: parseInt(document.getElementById('edit-fee').value),
      6: document.getElementById('edit-start').value,
      8: document.getElementById('edit-pay').value,
      12: document.getElementById('edit-active').value,
      13: document.getElementById('edit-gift').value,
      14: document.getElementById('edit-note').value.trim()
    };
    
    try {
      const res = await authedApi({
        action: 'updateRow',
        sheetName: '02_包年合約台帳',
        row: editingRow,
        payload: JSON.stringify(payload)
      });
      if (res.ok) {
        showToast('已更新', 'success');
        closeEditModal();
        await loadCustomers();
        if (activeTeacher) {
          // 重新顯示該老師詳情
          const card = Array.from(document.querySelectorAll('.teacher-card')).find(c => c.querySelector('.teacher-card-name').textContent === activeTeacher);
          if (card) card.click();
        }
      } else {
        showToast('更新失敗：' + (res.error || ''), 'error');
      }
    } catch (e) {
      showToast('連線失敗：' + e.message, 'error');
    }
  }
  
  async function confirmDelete(rowIdx, name) {
    if (!confirm(`確定要刪除客戶「${name}」？此動作無法還原。`)) return;
    try {
      const res = await authedApi({ action: 'deleteRow', sheetName: '02_包年合約台帳', row: rowIdx });
      if (res.ok) {
        showToast('已刪除', 'success');
        await loadCustomers();
        if (activeTeacher) {
          const card = Array.from(document.querySelectorAll('.teacher-card')).find(c => c.querySelector('.teacher-card-name').textContent === activeTeacher);
          if (card) card.click();
        }
      } else {
        showToast('刪除失敗', 'error');
      }
    } catch (e) {
      showToast('連線失敗：' + e.message, 'error');
    }
  }
  
  // ========== 客戶 ID 自動產生 ==========
  async function loadNextId(kind, teacher) {
    const el = document.getElementById('next-id-' + kind);
    if (!teacher) {
      el.className = 'id-display empty';
      el.textContent = '請先選擇老師';
      return;
    }
    el.className = 'id-display loading';
    el.textContent = '系統產生中…';
    try {
      const res = await authedApi({ action: 'getNextCustomerId', teacher: teacher });
      if (res.ok && res.data && res.data.nextId) {
        el.className = 'id-display';
        el.textContent = res.data.nextId;
      } else {
        el.textContent = '產生失敗';
      }
    } catch (e) {
      el.textContent = '連線失敗';
    }
  }
  
  // ========== 新增包年 ==========
  function resetBaonianForm() {
    document.getElementById('bn-teacher').value = '';
    document.getElementById('bn-name').value = '';
    document.getElementById('bn-fee').value = '';
    document.getElementById('bn-start').value = todayMonth();
    document.getElementById('bn-pay').value = todayDate();
    document.getElementById('bn-gift').value = '';
    document.getElementById('bn-note').value = '';
    document.getElementById('gift-group').style.display = 'none';
    document.getElementById('next-id-baonian').className = 'id-display empty';
    document.getElementById('next-id-baonian').textContent = '請先選擇老師';
  }
  
  async function submitBaonian() {
    const teacher = document.getElementById('bn-teacher').value;
    const name = document.getElementById('bn-name').value.trim();
    const fee = document.getElementById('bn-fee').value;
    const start = document.getElementById('bn-start').value;
    const pay = document.getElementById('bn-pay').value;
    const gift = document.getElementById('bn-gift').value;
    const note = document.getElementById('bn-note').value.trim();
    
    if (!teacher) { showToast('請選老師', 'error'); return; }
    if (!name) { showToast('請填客戶姓名', 'error'); return; }
    if (!fee) { showToast('請選月費', 'error'); return; }
    if (!start) { showToast('請選起始月份', 'error'); return; }
    if (!pay) { showToast('請選首付日期', 'error'); return; }
    if (fee === '4200' && !gift) { showToast('4,200 月費需選贈送年斗', 'error'); return; }
    
    const btn = document.getElementById('submit-baonian');
    btn.disabled = true; btn.textContent = '處 理 中…';
    
    try {
      const payload = { teacher, name, fee, startMonth: start, payDate: pay, giftDouType: gift, note };
      const res = await authedApi({ action: 'addBaonian', payload: JSON.stringify(payload) });
      if (res.ok) {
        showToast('新增成功！客戶 ID：' + (res.data && res.data.customerId || '-'), 'success');
        resetBaonianForm();
      } else {
        showToast('新增失敗：' + (res.error || ''), 'error');
      }
    } catch (e) {
      showToast('連線失敗：' + e.message, 'error');
    } finally {
      btn.disabled = false; btn.textContent = '新　增　包　年';
    }
  }
  
  // ========== 新增斗燈 ==========
  function resetDoudengForm() {
    document.getElementById('dd-teacher').value = '';
    document.getElementById('dd-name').value = '';
    document.getElementById('dd-doutype').value = '';
    document.getElementById('dd-type').value = '';
    document.getElementById('dd-position').value = '';
    document.getElementById('dd-start').value = todayMonth();
    document.getElementById('dd-note').value = '';
    document.getElementById('next-id-doudeng').className = 'id-display empty';
    document.getElementById('next-id-doudeng').textContent = '請先選擇老師';
  }
  
  async function submitDoudeng() {
    const teacher = document.getElementById('dd-teacher').value;
    const name = document.getElementById('dd-name').value.trim();
    const douType = document.getElementById('dd-doutype').value;
    const type = document.getElementById('dd-type').value;
    const position = document.getElementById('dd-position').value.trim();
    const start = document.getElementById('dd-start').value;
    const note = document.getElementById('dd-note').value.trim();
    
    if (!teacher) { showToast('請選老師', 'error'); return; }
    if (!name) { showToast('請填客戶姓名', 'error'); return; }
    if (!douType) { showToast('請選斗種', 'error'); return; }
    if (!type) { showToast('請選類型', 'error'); return; }
    if (!start) { showToast('請選安斗月份', 'error'); return; }
    
    const btn = document.getElementById('submit-doudeng');
    btn.disabled = true; btn.textContent = '處 理 中…';
    
    try {
      const payload = { teacher, name, douType, type, position, startMonth: start, note };
      const res = await authedApi({ action: 'addDoudeng', payload: JSON.stringify(payload) });
      if (res.ok) {
        showToast('新增斗燈成功！編號：' + (res.data && res.data.no), 'success');
        resetDoudengForm();
      } else {
        showToast('新增失敗：' + (res.error || ''), 'error');
      }
    } catch (e) {
      showToast('連線失敗：' + e.message, 'error');
    } finally {
      btn.disabled = false; btn.textContent = '新　增　斗　燈';
    }
  }
  
  // ========== 本月燒化 ==========
  async function loadBurn() {
    const month = document.getElementById('burn-month').value;
    const teacher = document.getElementById('burn-teacher').value;
    if (!month) return;
    
    const content = document.getElementById('burn-content');
    content.innerHTML = '<div class="empty-hint">載入中...</div>';
    document.getElementById('burn-stats').style.display = 'none';
    
    try {
      const res = await authedApi({ action: 'getMonthlyBurn', month: month, teacher: teacher });
      if (!res.ok) { content.innerHTML = '<div class="empty-hint">查詢失敗</div>'; return; }
      const data = res.data || {};
      const customers = data.customers || [];
      
      const stats = document.getElementById('burn-stats');
      stats.style.display = 'grid';
      stats.innerHTML = `
        <div class="stat-card crimson">
          <div class="stat-label">客戶數</div>
          <div class="stat-value">${customers.length}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">萬寶金總份數</div>
          <div class="stat-value">${data.totalWbj || 0}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">天赦金總份數</div>
          <div class="stat-value">${data.totalTsj || 0}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">查詢月份</div>
          <div class="stat-value" style="font-size:20px;">${month}</div>
        </div>
      `;
      
      if (customers.length === 0) {
        content.innerHTML = '<div class="empty-hint"><div class="big">無資料</div>本月沒有需燒化的客戶</div>';
        return;
      }
      
      let html = '<table class="data-table"><thead><tr><th>客戶 ID</th><th>姓名</th><th>老師</th><th>月費</th><th>起始</th><th>到期</th><th>萬寶金</th><th>天赦金</th></tr></thead><tbody>';
      customers.forEach(c => {
        html += `<tr>
          <td><strong>${esc(c.customerId)}</strong></td>
          <td>${esc(c.name)}</td>
          <td>${esc(c.teacher)}</td>
          <td>${num(c.fee)}</td>
          <td>${esc(c.startMonth)}</td>
          <td>${esc(c.endMonth)}</td>
          <td>${num(c.wbj)}</td>
          <td>${num(c.tsj)}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      content.innerHTML = html;
    } catch (e) {
      content.innerHTML = '<div class="empty-hint">連線失敗：' + esc(e.message) + '</div>';
    }
  }
  
  // ========== 本月撤斗 ==========
  async function loadRetire() {
    const month = document.getElementById('retire-month').value;
    const teacher = document.getElementById('retire-teacher').value;
    if (!month) return;
    
    const content = document.getElementById('retire-content');
    content.innerHTML = '<div class="empty-hint">載入中...</div>';
    
    try {
      const res = await authedApi({ action: 'getRetireList', month: month, teacher: teacher });
      if (!res.ok) { content.innerHTML = '<div class="empty-hint">查詢失敗</div>'; return; }
      const lamps = (res.data && res.data.lamps) || [];
      
      if (lamps.length === 0) {
        content.innerHTML = '<div class="empty-hint"><div class="big">無資料</div>本月沒有需撤的斗燈</div>';
        return;
      }
      
      let html = `<div style="margin-bottom:16px;color:var(--ink-light);">共 <strong style="color:var(--ink);">${lamps.length}</strong> 筆需撤斗</div>`;
      html += '<table class="data-table"><thead><tr><th>編號</th><th>客戶 ID</th><th>姓名</th><th>老師</th><th>斗種</th><th>架位</th><th>類型</th><th>安斗月</th><th>應撤月</th><th>已撤</th></tr></thead><tbody>';
      lamps.forEach(l => {
        const retired = l.retired === '是' 
          ? '<span class="badge badge-active">已撤</span>' 
          : '<span class="badge badge-expire">待撤</span>';
        html += `<tr>
          <td>${esc(l.no)}</td>
          <td>${esc(l.customerId)}</td>
          <td>${esc(l.name)}</td>
          <td>${esc(l.teacher)}</td>
          <td>${esc(l.douType)}</td>
          <td>${esc(l.position)}</td>
          <td>${esc(l.type)}</td>
          <td>${esc(l.startMonth)}</td>
          <td>${esc(l.endMonth)}</td>
          <td>${retired}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      content.innerHTML = html;
    } catch (e) {
      content.innerHTML = '<div class="empty-hint">連線失敗：' + esc(e.message) + '</div>';
    }
  }
  
  // ========== 年度業績 ==========
  async function loadTrend() {
    const teacher = document.getElementById('trend-teacher').value;
    const year = document.getElementById('trend-year').value;
    
    const content = document.getElementById('trend-content');
    if (!teacher || !year) {
      content.innerHTML = '<div class="empty-hint">請選擇老師和年份</div>';
      return;
    }
    content.innerHTML = '<div class="empty-hint">載入中...</div>';
    
    try {
      const res = await authedApi({ action: 'getYearlyTrend', teacher: teacher, year: year });
      if (!res.ok) { content.innerHTML = '<div class="empty-hint">查詢失敗</div>'; return; }
      const months = (res.data && res.data.months) || [];
      
      let totalWbj = 0, totalTsj = 0, totalCustomers = 0;
      months.forEach(m => { totalWbj += m.wbj; totalTsj += m.tsj; if (m.customerCount > totalCustomers) totalCustomers = m.customerCount; });
      
      let html = `<div class="stats-row" style="margin-bottom:24px;">
        <div class="stat-card crimson"><div class="stat-label">${esc(teacher)} ・ ${year}</div><div class="stat-value" style="font-size:20px;">年度</div></div>
        <div class="stat-card"><div class="stat-label">最高同時客戶數</div><div class="stat-value">${totalCustomers}</div></div>
        <div class="stat-card"><div class="stat-label">全年萬寶金總</div><div class="stat-value">${totalWbj}</div></div>
        <div class="stat-card"><div class="stat-label">全年天赦金總</div><div class="stat-value">${totalTsj}</div></div>
      </div>`;
      
      html += '<table class="data-table"><thead><tr><th>月份</th><th>同時客戶</th><th>萬寶金</th><th>天赦金</th></tr></thead><tbody>';
      months.forEach(m => {
        html += `<tr>
          <td><strong>${esc(m.monthLabel)}</strong></td>
          <td>${m.customerCount}</td>
          <td>${m.wbj}</td>
          <td>${m.tsj}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      content.innerHTML = html;
    } catch (e) {
      content.innerHTML = '<div class="empty-hint">連線失敗：' + esc(e.message) + '</div>';
    }
  }
  </script>
