<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>斗燈系統 · 老師介面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1f2e;
    --ink-2: #2a3142;
    --paper: #f7f4ed;
    --paper-2: #ede8db;
    --gold: #c9a449;
    --gold-light: #e8c97a;
    --indigo: #3a4a6b;
    --indigo-light: #6c84b3;
    --vermillion: #b85450;
    --jade: #5a8a6b;
    --gray: #9aa0aa;
    --shadow: rgba(26, 31, 46, 0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: 0.02em;
  }
  .serif { font-family: 'Noto Serif TC', serif; }
  .login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background:
      radial-gradient(circle at 20% 20%, rgba(201,164,73,0.08), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(58,74,107,0.06), transparent 50%),
      var(--paper);
  }
  .login-card {
    width: 100%; max-width: 420px; background: white; border-radius: 4px;
    padding: 48px 32px;
    box-shadow: 0 24px 60px var(--shadow), 0 4px 16px rgba(26,31,46,0.08);
    position: relative;
  }
  .login-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
  }
  .login-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 28px; font-weight: 700; color: var(--ink);
    margin-bottom: 4px; letter-spacing: 0.08em;
  }
  .login-subtitle {
    font-size: 13px; color: var(--gray); margin-bottom: 20px; letter-spacing: 0.1em;
  }
  .demo-banner {
    background: rgba(201,164,73,0.12); border-left: 3px solid var(--gold);
    padding: 10px 12px; margin-bottom: 16px;
    font-size: 13px; color: var(--ink-2); line-height: 1.6;
  }
  .form-label {
    display: block; font-size: 14px; color: var(--ink-2);
    font-weight: 500; margin-bottom: 8px; margin-top: 20px;
  }
  .form-label:first-of-type { margin-top: 0; }
  .form-input, .form-select {
    width: 100%; padding: 14px 16px; font-size: 16px;
    font-family: inherit;
    border: 1.5px solid #d4cfc1; border-radius: 4px;
    background: var(--paper); color: var(--ink);
    transition: border-color 0.2s, background 0.2s;
  }
  .form-input:focus, .form-select:focus {
    outline: none; border-color: var(--gold); background: white;
  }
  .form-input::placeholder { color: var(--gray); }
  .btn-primary {
    width: 100%; padding: 16px; margin-top: 28px;
    background: var(--ink); color: var(--paper);
    border: none; border-radius: 4px;
    font-size: 16px; font-family: inherit; font-weight: 700;
    letter-spacing: 0.15em; cursor: pointer;
    transition: transform 0.1s, background 0.2s;
  }
  .btn-primary:hover { background: var(--ink-2); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .login-error {
    margin-top: 16px; padding: 12px;
    background: #fdf0ef; color: var(--vermillion);
    border-left: 3px solid var(--vermillion); font-size: 14px;
  }
  .app { display: none; min-height: 100vh; }
  .app.active { display: block; }
  .header {
    background: var(--ink); color: var(--paper);
    padding: 16px 20px; display: flex;
    align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .header-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 18px; font-weight: 700; letter-spacing: 0.1em;
  }
  .header-title .divider { color: var(--gold); margin: 0 8px; }
  .header-user { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  .btn-logout {
    background: transparent; border: 1px solid var(--gold);
    color: var(--gold); padding: 6px 14px;
    border-radius: 3px; font-size: 13px; cursor: pointer;
    font-family: inherit; transition: background 0.2s;
  }
  .btn-logout:hover { background: var(--gold); color: var(--ink); }
  .tabs {
    background: white; display: flex;
    border-bottom: 1px solid var(--paper-2);
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    position: sticky; top: 56px; z-index: 50;
  }
  .tab {
    flex-shrink: 0; min-width: 100px;
    padding: 14px 16px; font-size: 14px;
    color: var(--gray); text-align: center;
    cursor: pointer; transition: color 0.2s;
    border-bottom: 3px solid transparent;
    font-weight: 500; white-space: nowrap;
  }
  .tab.active {
    color: var(--ink); border-bottom-color: var(--gold);
    font-weight: 700;
  }
  .tab.add-tab.active { border-bottom-color: var(--vermillion); }
  .tab.add-tab { color: var(--vermillion); }
  .tab:hover { color: var(--ink); }
  .content {
    padding: 20px 16px; max-width: 720px; margin: 0 auto;
  }
  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn 0.3s; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .month-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: white; border-radius: 4px;
    padding: 14px 18px; margin-bottom: 16px;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .month-bar-label { font-size: 13px; color: var(--gray); letter-spacing: 0.1em; }
  .month-bar-value {
    font-family: 'Noto Serif TC', serif;
    font-size: 22px; font-weight: 700;
    color: var(--ink); margin-top: 2px;
  }
  .month-nav { display: flex; gap: 8px; }
  .month-nav button {
    width: 36px; height: 36px;
    border: 1.5px solid var(--paper-2);
    background: var(--paper); border-radius: 3px;
    cursor: pointer; font-size: 18px;
    color: var(--ink-2); font-family: inherit;
  }
  .month-nav button:hover {
    background: var(--ink); color: var(--paper); border-color: var(--ink);
  }
  .stat-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 12px; margin-bottom: 20px;
  }
  .stat-card {
    background: white; border-radius: 4px;
    padding: 18px 16px;
    box-shadow: 0 2px 8px var(--shadow);
    border-left: 3px solid var(--gold);
  }
  .stat-card.indigo { border-left-color: var(--indigo); }
  .stat-card.jade { border-left-color: var(--jade); }
  .stat-card.vermillion { border-left-color: var(--vermillion); }
  .stat-label { font-size: 13px; color: var(--gray); letter-spacing: 0.05em; margin-bottom: 6px; }
  .stat-value {
    font-family: 'Noto Serif TC', serif;
    font-size: 32px; font-weight: 900;
    color: var(--ink); line-height: 1;
  }
  .stat-unit { font-size: 14px; color: var(--gray); margin-left: 4px; font-family: inherit; }
  .section-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 18px; font-weight: 700; color: var(--ink);
    margin: 24px 0 12px; padding-left: 12px;
    border-left: 4px solid var(--gold); letter-spacing: 0.05em;
  }
  .item-card {
    background: white; border-radius: 4px;
    padding: 16px; margin-bottom: 10px;
    box-shadow: 0 2px 6px var(--shadow);
    transition: transform 0.15s;
  }
  .item-card:hover { transform: translateX(4px); }
  .item-row {
    display: flex; justify-content: space-between;
    align-items: flex-start; gap: 12px;
  }
  .item-name {
    font-size: 17px; font-weight: 700;
    color: var(--ink); margin-bottom: 4px;
  }
  .item-meta {
    font-size: 13px; color: var(--gray); line-height: 1.6;
  }
  .item-meta span:not(:last-child)::after {
    content: '·'; margin: 0 6px; color: var(--paper-2);
  }
  .item-tags {
    display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px;
  }
  .tag {
    font-size: 12px; padding: 3px 8px;
    border-radius: 2px;
    background: var(--paper); color: var(--ink-2);
    border: 1px solid var(--paper-2);
  }
  .tag.gold { background: rgba(201,164,73,0.1); color: var(--gold); border-color: var(--gold); }
  .tag.indigo { background: rgba(58,74,107,0.08); color: var(--indigo); border-color: var(--indigo-light); }
  .tag.jade { background: rgba(90,138,107,0.1); color: var(--jade); border-color: var(--jade); }
  .tag.vermillion { background: rgba(184,84,80,0.08); color: var(--vermillion); border-color: var(--vermillion); }
  .item-burn {
    display: flex; gap: 16px; margin-top: 10px;
    padding-top: 10px; border-top: 1px dashed var(--paper-2);
  }
  .burn-num {
    font-family: 'Noto Serif TC', serif;
    font-size: 15px; color: var(--ink); font-weight: 700;
  }
  .burn-num span {
    font-size: 12px; color: var(--gray);
    font-weight: 400; margin-left: 4px;
  }
  .empty {
    text-align: center; padding: 60px 24px; color: var(--gray);
  }
  .empty-icon {
    font-size: 48px; opacity: 0.3; margin-bottom: 12px;
    font-family: 'Noto Serif TC', serif;
  }
  .empty-text { font-size: 15px; line-height: 1.6; }
  .trend-grid {
    display: grid; grid-template-columns: repeat(6, 1fr);
    gap: 6px; background: white; padding: 16px;
    border-radius: 4px; box-shadow: 0 2px 8px var(--shadow);
  }
  .trend-bar {
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
  }
  .trend-bar-label { font-size: 12px; color: var(--gray); }
  .trend-bar-fill-wrap {
    width: 100%; height: 80px; background: var(--paper);
    position: relative; border-radius: 2px;
    display: flex; align-items: flex-end;
  }
  .trend-bar-fill {
    width: 100%;
    background: linear-gradient(180deg, var(--gold), var(--gold-light));
    border-radius: 2px 2px 0 0;
    transition: height 0.6s ease-out; min-height: 2px;
  }
  .trend-bar-value {
    font-family: 'Noto Serif TC', serif;
    font-size: 13px; font-weight: 700; color: var(--ink);
  }
  .search-box { position: relative; margin-bottom: 16px; }
  .search-input {
    width: 100%; padding: 14px 16px 14px 44px;
    font-size: 16px; font-family: inherit;
    border: 1.5px solid var(--paper-2); border-radius: 4px;
    background: white; color: var(--ink);
  }
  .search-input:focus { outline: none; border-color: var(--gold); }
  .search-icon {
    position: absolute; left: 16px; top: 50%;
    transform: translateY(-50%);
    color: var(--gray); font-size: 18px;
  }
  .customer-detail {
    background: white; border-radius: 4px;
    padding: 20px; margin-bottom: 12px;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .customer-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 14px; padding-bottom: 14px;
    border-bottom: 1px solid var(--paper-2);
    gap: 8px; flex-wrap: wrap;
  }
  .customer-name-large {
    font-family: 'Noto Serif TC', serif;
    font-size: 24px; font-weight: 700;
    color: var(--ink); margin-bottom: 2px;
  }
  .customer-id {
    font-size: 12px; color: var(--gray);
    letter-spacing: 0.1em; font-family: monospace;
  }
  .customer-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .btn-icon {
    padding: 6px 10px; font-size: 12px;
    border: 1px solid var(--paper-2);
    background: white; border-radius: 3px;
    cursor: pointer; font-family: inherit;
    color: var(--ink-2);
  }
  .btn-icon:hover { background: var(--paper); }
  .btn-icon.danger { color: var(--vermillion); border-color: rgba(184,84,80,0.3); }
  .btn-icon.danger:hover { background: rgba(184,84,80,0.08); }
  .customer-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 12px; margin-bottom: 14px;
  }
  .customer-field-label { font-size: 12px; color: var(--gray); margin-bottom: 2px; }
  .customer-field-value { font-size: 15px; color: var(--ink); font-weight: 500; }
  .lamp-list {
    margin-top: 12px; padding-top: 14px;
    border-top: 1px solid var(--paper-2);
  }
  .lamp-list-title {
    font-size: 14px; font-weight: 700;
    color: var(--ink); margin-bottom: 10px;
  }
  .lamp-item {
    display: flex; justify-content: space-between;
    align-items: center; padding: 8px 0;
    font-size: 14px; border-bottom: 1px dashed var(--paper-2);
  }
  .lamp-item:last-child { border: none; }
  .form-card {
    background: white; border-radius: 4px;
    padding: 24px; box-shadow: 0 2px 8px var(--shadow);
    margin-bottom: 16px;
  }
  .form-card-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 18px; font-weight: 700;
    color: var(--ink); margin-bottom: 6px;
  }
  .form-card-hint {
    font-size: 13px; color: var(--gray);
    margin-bottom: 18px; line-height: 1.6;
  }
  .form-card-hint strong { color: var(--gold); }
  .form-grid {
    display: grid; grid-template-columns: 1fr; gap: 14px;
  }
  @media (min-width: 640px) {
    .form-grid { grid-template-columns: repeat(2, 1fr); }
    .form-grid .full { grid-column: 1 / -1; }
  }
  .form-field-label {
    display: block; font-size: 13px;
    color: var(--ink-2); font-weight: 500;
    margin-bottom: 6px;
  }
  .form-field-label.required::after {
    content: '*'; color: var(--vermillion); margin-left: 4px;
  }
  .form-field-input, .form-field-select, .form-field-textarea {
    width: 100%; padding: 12px 14px;
    font-size: 15px; font-family: inherit;
    border: 1.5px solid #d4cfc1; border-radius: 4px;
    background: white; color: var(--ink);
  }
  .form-field-textarea { min-height: 70px; resize: vertical; }
  .form-field-input:focus, .form-field-select:focus, .form-field-textarea:focus {
    outline: none; border-color: var(--gold);
  }
  .form-row {
    display: flex; gap: 12px; margin-top: 20px;
  }
  .form-row .btn-primary {
    margin-top: 0; flex: 1;
  }
  .btn-secondary {
    background: var(--paper-2); color: var(--ink-2);
    border: 1.5px solid var(--paper-2);
    padding: 14px 20px; border-radius: 4px;
    cursor: pointer; font-family: inherit;
    font-size: 15px; font-weight: 500;
  }
  .btn-secondary:hover { background: white; }
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(26,31,46,0.5);
    display: none; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
  }
  .modal-backdrop.active { display: flex; }
  .modal {
    background: white; border-radius: 4px;
    width: 100%; max-width: 560px;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 24px 60px rgba(0,0,0,0.3);
  }
  .modal-header {
    padding: 20px 24px; border-bottom: 1px solid var(--paper-2);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 18px; font-weight: 700; color: var(--ink);
  }
  .modal-close {
    background: transparent; border: none;
    font-size: 22px; color: var(--gray);
    cursor: pointer; padding: 0 4px;
  }
  .modal-body { padding: 20px 24px; }
  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--paper-2);
    display: flex; gap: 10px; justify-content: flex-end;
  }
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--ink); color: var(--paper);
    padding: 12px 24px; border-radius: 4px;
    font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    transition: transform 0.3s; z-index: 2000;
  }
  .toast.active { transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--vermillion); }
  .toast.success { background: var(--jade); }
  .loading {
    text-align: center; padding: 40px 20px; color: var(--gray);
  }
  .loading::before {
    content: '◐'; display: inline-block;
    margin-right: 8px;
    animation: rotate 1s linear infinite; color: var(--gold);
  }
  @keyframes rotate { to { transform: rotate(360deg); } }
  @media (min-width: 768px) {
    .stat-grid { grid-template-columns: repeat(4, 1fr); }
    .trend-grid { grid-template-columns: repeat(12, 1fr); }
    .header { padding: 16px 32px; }
    .content { padding: 28px 24px; max-width: 960px; }
  }
</style>
</head>
<body>

<div id="login-screen" class="login-screen">
  <div class="login-card">
    <h1 class="login-title">斗燈系統</h1>
    <p class="login-subtitle serif">老 師 介 面</p>
    <label class="form-label">選擇老師</label>
    <select id="teacher-select" class="form-select">
      <option value="">— 請選擇 —</option>
    </select>
    <label class="form-label">密碼</label>
    <input type="password" id="password-input" class="form-input" placeholder="輸入密碼" autocomplete="off">
    <button id="login-btn" class="btn-primary">進 入</button>
    <div id="login-error" class="login-error" style="display:none;"></div>
  </div>
</div>

<div id="app" class="app">
  <header class="header">
    <div class="header-title">斗 燈<span class="divider">·</span>老師介面</div>
    <div class="header-user">
      <span id="current-teacher"></span>
      <button class="btn-logout" onclick="logout()">登出</button>
    </div>
  </header>

  <nav class="tabs">
    <div class="tab add-tab active" data-tab="add-baonian">＋ 新增包年</div>
    <div class="tab add-tab" data-tab="add-doudeng">＋ 新增斗燈</div>
    <div class="tab" data-tab="burn">本月燒化</div>
    <div class="tab" data-tab="retire">本月撤斗</div>
    <div class="tab" data-tab="trend">年度業績</div>
    <div class="tab" data-tab="search">客戶查詢</div>
  </nav>

  <main class="content">
    <div id="month-bar" class="month-bar" style="display:none;">
      <div>
        <div class="month-bar-label">查詢月份</div>
        <div id="month-display" class="month-bar-value">2026-04</div>
      </div>
      <div class="month-nav">
        <button onclick="changeMonth(-1)">‹</button>
        <button onclick="changeMonth(1)">›</button>
      </div>
    </div>

    <section id="panel-burn" class="panel">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label">客戶數</div>
          <div class="stat-value"><span id="burn-count">—</span><span class="stat-unit">位</span></div>
        </div>
        <div class="stat-card indigo">
          <div class="stat-label">萬寶金</div>
          <div class="stat-value"><span id="burn-wbj">—</span><span class="stat-unit">份</span></div>
        </div>
        <div class="stat-card jade">
          <div class="stat-label">天赦金</div>
          <div class="stat-value"><span id="burn-tsj">—</span><span class="stat-unit">份</span></div>
        </div>
        <div class="stat-card vermillion">
          <div class="stat-label">總份數</div>
          <div class="stat-value"><span id="burn-total">—</span><span class="stat-unit">份</span></div>
        </div>
      </div>
      <h3 class="section-title">本月包年燒化客戶</h3>
      <div id="burn-list"></div>
    </section>

    <section id="panel-retire" class="panel">
      <div class="stat-grid">
        <div class="stat-card vermillion">
          <div class="stat-label">應撤總數</div>
          <div class="stat-value"><span id="retire-total">—</span><span class="stat-unit">盞</span></div>
        </div>
        <div class="stat-card jade">
          <div class="stat-label">已撤</div>
          <div class="stat-value"><span id="retire-done">—</span><span class="stat-unit">盞</span></div>
        </div>
        <div class="stat-card indigo">
          <div class="stat-label">未撤</div>
          <div class="stat-value"><span id="retire-pending">—</span><span class="stat-unit">盞</span></div>
        </div>
      </div>
      <h3 class="section-title">應撤明細</h3>
      <div id="retire-list"></div>
    </section>

    <section id="panel-trend" class="panel">
      <div class="month-bar" style="margin-bottom:20px;">
        <div>
          <div class="month-bar-label">年度</div>
          <div id="year-display" class="month-bar-value">2026</div>
        </div>
        <div class="month-nav">
          <button onclick="changeYear(-1)">‹</button>
          <button onclick="changeYear(1)">›</button>
        </div>
      </div>
      <div class="stat-grid" style="grid-template-columns:repeat(2,1fr);">
        <div class="stat-card">
          <div class="stat-label">全年萬寶金總份數</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbzz9zWTST80TjzeYfc7S_8FbXAGjYbUu8QtJgu9Mf3WclA32pgF_WNHDyr9fXujKbov/exec';
  const TEACHERS = ['陳捷容', '蕭竣方', '陳彩綺', '周冠榮', '沈佳琪',
    '羅文勳', '蕭鎧峻', '鐘宥涵', '湯雯莉', '謝承殷',
    '林雅涵', '陳昕昀', '熊卿妃', '朱沛語', '靈應壇+員工',
    '賴素貞', '張簡玉靖', '梁凱妍', '鄭聖勳', '王宥心'];

  let currentTeacher = '';
  let currentPassword = '';
  let currentMonth = '';
  let currentYear = '';
  let currentTab = 'add-baonian';
  let searchTimer = null;
  let cachedCustomers = [];

  document.addEventListener('DOMContentLoaded', () => {
    initMonthYear();
    fillTeacherList();
    bindEvents();
    const savedTeacher = sessionStorage.getItem('teacher');
    const savedPwd = sessionStorage.getItem('teacherPwd');
    if (savedTeacher && savedPwd) {
      currentTeacher = savedTeacher;
      currentPassword = savedPwd;
      enterApp();
    }
  });

  function initMonthYear() {
    const now = new Date();
    currentMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    currentYear = String(now.getFullYear());
    document.getElementById('month-display').textContent = currentMonth;
    document.getElementById('year-display').textContent = currentYear;
  }

  function fillTeacherList() {
    const sel = document.getElementById('teacher-select');
    TEACHERS.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      sel.appendChild(opt);
    });
  }

  function bindEvents() {
    document.getElementById('login-btn').addEventListener('click', login);
    document.getElementById('password-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });
    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => switchTab(t.dataset.tab));
    });
  }

  async function login() {
    const teacher = document.getElementById('teacher-select').value;
    const password = document.getElementById('password-input').value;
    document.getElementById('login-error').style.display = 'none';
    if (!teacher) { showError('請選擇老師'); return; }
    if (!password) { showError('請輸入密碼'); return; }
    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = '驗證中...';
    try {
      const r = await api({ action: 'login', role: 'teacher', password: password });
      if (!r.ok) {
        showError(r.error || '登入失敗');
        btn.disabled = false; btn.textContent = '進 入';
        return;
      }
      currentTeacher = teacher;
      currentPassword = password;
      sessionStorage.setItem('teacher', teacher);
      sessionStorage.setItem('teacherPwd', password);
      enterApp();
    } catch (err) {
      showError('連線失敗：' + err.message);
      btn.disabled = false; btn.textContent = '進 入';
    }
  }

  function showError(msg) {
    const el = document.getElementById('login-error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function logout() {
    sessionStorage.removeItem('teacher');
    sessionStorage.removeItem('teacherPwd');
    currentTeacher = ''; currentPassword = '';
    document.getElementById('app').classList.remove('active');
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('password-input').value = '';
    document.getElementById('login-btn').disabled = false;
    document.getElementById('login-btn').textContent = '進 入';
  }

  function enterApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('active');
    document.getElementById('current-teacher').textContent = currentTeacher;
    document.getElementById('hint-teacher').textContent = currentTeacher;
    document.getElementById('hint-teacher2').textContent = currentTeacher;
    setDefaultDates();
    switchTab('add-baonian');
  }

  function setDefaultDates() {
    const now = new Date();
    const ymStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    const ymdStr = ymStr + '-' + String(now.getDate()).padStart(2, '0');
    document.getElementById('bn-startMonth').value = ymStr;
    document.getElementById('bn-payDate').value = ymdStr;
    document.getElementById('dd-startMonth').value = ymStr;
  }

  function switchTab(name) {
    currentTab = name;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === name);
    });
    document.querySelectorAll('.panel').forEach(p => {
      p.classList.toggle('active', p.id === 'panel-' + name);
    });
    const monthBar = document.getElementById('month-bar');
    if (name === 'burn' || name === 'retire') {
      monthBar.style.display = '';
      const target = document.getElementById('panel-' + name);
      target.insertBefore(monthBar, target.firstChild);
    } else {
      monthBar.style.display = 'none';
    }
    if (name === 'burn') loadBurn();
    else if (name === 'retire') loadRetire();
    else if (name === 'trend') loadTrend();
    else if (name === 'search') loadSearch('');
  }

  function changeMonth(delta) {
    const [y, m] = currentMonth.split('-').map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    currentMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    document.getElementById('month-display').textContent = currentMonth;
    if (currentTab === 'burn') loadBurn();
    else if (currentTab === 'retire') loadRetire();
  }

  function changeYear(delta) {
    currentYear = String(parseInt(currentYear) + delta);
    document.getElementById('year-display').textContent = currentYear;
    loadTrend();
  }

  async function loadBurn() {
    const list = document.getElementById('burn-list');
    list.innerHTML = '<div class="loading">載入中...</div>';
    try {
      const r = await api({
        action: 'getMonthlyBurn', role: 'teacher', password: currentPassword,
        teacher: currentTeacher, month: currentMonth
      });
      if (!r.ok) { list.innerHTML = '<div class="empty"><div class="empty-text">' + r.error + '</div></div>'; return; }
      const d = r.data;
      document.getElementById('burn-count').textContent = d.customers.length;
      document.getElementById('burn-wbj').textContent = d.totalWbj;
      document.getElementById('burn-tsj').textContent = d.totalTsj;
      document.getElementById('burn-total').textContent = d.totalWbj + d.totalTsj;
      if (!d.customers.length) {
        list.innerHTML = '<div class="empty"><div class="empty-icon">○</div><div class="empty-text">本月無包年客戶</div></div>';
        return;
      }
      list.innerHTML = d.customers.map(c => `
        <div class="item-card">
          <div class="item-row">
            <div style="flex:1;">
              <div class="item-name">${esc(c.name)} <span style="font-size:13px;color:var(--gray);font-weight:400;font-family:monospace;">${esc(c.customerId)}</span></div>
              <div class="item-meta">
                <span>月費 NT$${num(c.fee)}</span>
                <span>包年期 ${esc(c.startMonth)} ～ ${esc(c.endMonth)}</span>
              </div>
            </div>
          </div>
          <div class="item-burn">
            <div class="burn-num">萬寶金 <span>${c.wbj} 份</span></div>
            <div class="burn-num">天赦金 <span>${c.tsj} 份</span></div>
          </div>
        </div>
      `).join('');
    } catch (err) {
      list.innerHTML = '<div class="empty"><div class="empty-text">連線失敗：' + err.message + '</div></div>';
    }
  }

  async function loadRetire() {
    const list = document.getElementById('retire-list');
    list.innerHTML = '<div class="loading">載入中...</div>';
    try {
      const r = await api({
        action: 'getRetireList', role: 'teacher', password: currentPassword,
        teacher: currentTeacher, month: currentMonth
      });
      if (!r.ok) { list.innerHTML = '<div class="empty"><div class="empty-text">' + r.error + '</div></div>'; return; }
      const lamps = r.data.lamps;
      const done = lamps.filter(l => l.retired === '是').length;
      const pending = lamps.length - done;
      document.getElementById('retire-total').textContent = lamps.length;
      document.getElementById('retire-done').textContent = done;
      document.getElementById('retire-pending').textContent = pending;
      if (!lamps.length) {
        list.innerHTML = '<div class="empty"><div class="empty-icon">○</div><div class="empty-text">本月無應撤斗燈</div></div>';
        return;
      }
      list.innerHTML = lamps.map(l => `
        <div class="item-card">
          <div class="item-row">
            <div style="flex:1;">
              <div class="item-name">${esc(l.name)} <span style="font-size:13px;color:var(--gray);font-weight:400;font-family:monospace;">${esc(l.no)}</span></div>
              <div class="item-meta">
                <span>${esc(l.douType)}</span>
                <span>${esc(l.type)}</span>
                ${l.position ? '<span>架位 <strong style="color:var(--vermillion)">' + esc(l.position) + '</strong></span>' : '<span style="color:var(--vermillion)">架位待補</span>'}
              </div>
              <div class="item-tags">
                ${l.retired === '是' ? '<span class="tag jade">✓ 已撤</span>' : '<span class="tag vermillion">未撤</span>'}
                <span class="tag">安斗 ${esc(l.startMonth)}</span>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    } catch (err) {
      list.innerHTML = '<div class="empty"><div class="empty-text">連線失敗：' + err.message + '</div></div>';
    }
  }

  async function loadTrend() {
    const chart = document.getElementById('trend-chart');
    chart.innerHTML = '<div class="loading">載入中...</div>';
    try {
      const r = await api({
        action: 'getYearlyTrend', role: 'teacher', password: currentPassword,
        teacher: currentTeacher, year: currentYear
      });
      if (!r.ok) { chart.innerHTML = '<div class="empty"><div class="empty-text">' + r.error + '</div></div>'; return; }
      const months = r.data.months;
      const totalWbj = months.reduce((s, m) => s + m.wbj, 0);
      const totalTsj = months.reduce((s, m) => s + m.tsj, 0);
      document.getElementById('year-wbj').textContent = totalWbj;
      document.getElementById('year-tsj').textContent = totalTsj;
      const max = Math.max(...months.map(m => m.wbj + m.tsj), 1);
      chart.innerHTML = months.map(m => {
        const total = m.wbj + m.tsj;
        const pct = (total / max) * 100;
        return `
          <div class="trend-bar">
            <div class="trend-bar-value">${total}</div>
            <div class="trend-bar-fill-wrap">
              <div class="trend-bar-fill" style="height:${pct}%"></div>
            </div>
            <div class="trend-bar-label">${esc(m.monthLabel)}</div>
          </div>
        `;
      }).join('');
    } catch (err) {
      chart.innerHTML = '<div class="empty"><div class="empty-text">連線失敗：' + err.message + '</div></div>';
    }
  }

  function onSearchInput() {
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      const kw = document.getElementById('search-input').value;
      loadSearch(kw);
    }, 350);
  }

  async function loadSearch(keyword) {
    const list = document.getElementById('search-result');
    list.innerHTML = '<div class="loading">載入中...</div>';
    try {
      const r = await api({
        action: 'searchCustomer', role: 'teacher', password: currentPassword,
        teacher: currentTeacher, keyword: keyword || ''
      });
      if (!r.ok) { list.innerHTML = '<div class="empty"><div class="empty-text">' + r.error + '</div></div>'; return; }
      cachedCustomers = r.data.customers;
      if (!cachedCustomers.length) {
        list.innerHTML = '<div class="empty"><div class="empty-icon">○</div><div class="empty-text">查無客戶</div></div>';
        return;
      }
      list.innerHTML = cachedCustomers.map(c => `
        <div class="customer-detail">
          <div class="customer-header">
            <div>
              <div class="customer-name-large">${esc(c.name)}</div>
              <div class="customer-id">${esc(c.customerId)}</div>
            </div>
            <div class="customer-actions">
              ${c.active === '是' ? '<span class="tag jade">生效中</span>' : '<span class="tag">' + esc(c.active || '未生效') + '</span>'}
              <button class="btn-icon" onclick='openEdit("${esc(c.customerId)}")'>編輯</button>
              <button class="btn-icon danger" onclick='confirmDelete("${esc(c.customerId)}", "${esc(c.name)}", ${c.rowIdx})'>刪除</button>
            </div>
          </div>
          <div class="customer-grid">
            <div><div class="customer-field-label">月費</div><div class="customer-field-value">NT$ ${num(c.fee)}</div></div>
            <div><div class="customer-field-label">所屬老師</div><div class="customer-field-value">${esc(c.teacher)}</div></div>
            <div><div class="customer-field-label">包年期</div><div class="customer-field-value">${esc(c.startMonth)} ～ ${esc(c.endMonth)}</div></div>
            <div><div class="customer-field-label">首付日期</div><div class="customer-field-value">${esc(c.payDate || '—')}</div></div>
            <div><div class="customer-field-label">每月萬寶金</div><div class="customer-field-value">${c.wbj} 份</div></div>
            <div><div class="customer-field-label">每月天赦金</div><div class="customer-field-value">${c.tsj} 份</div></div>
          </div>
          ${c.giftDouType ? `<div style="font-size:13px;color:var(--gray);margin-bottom:8px;">贈送年斗：<strong style="color:var(--gold);">${esc(c.giftDouType)}</strong></div>` : ''}
          ${c.note ? `<div style="font-size:13px;color:var(--gray);">備註：${esc(c.note)}</div>` : ''}
          ${c.lamps && c.lamps.length ? `
            <div class="lamp-list">
              <div class="lamp-list-title">名下斗燈（${c.lamps.length} 盞）</div>
              ${c.lamps.map(l => `
                <div class="lamp-item">
                  <div>
                    <strong>${esc(l.douType || '—')}</strong>
                    <span style="color:var(--gray);font-size:13px;margin-left:6px;">${esc(l.type)}</span>
                  </div>
                  <div style="font-size:13px;color:var(--gray);">
                    ${esc(l.startMonth)} ～ ${esc(l.endMonth)}
                    ${l.retired === '是' ? '<span class="tag jade" style="margin-left:6px;">已撤</span>' : '<span class="tag vermillion" style="margin-left:6px;">未撤</span>'}
                  </div>
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>
      `).join('');
    } catch (err) {
      list.innerHTML = '<div class="empty"><div class="empty-text">連線失敗：' + err.message + '</div></div>';
    }
  }

  function openEdit(customerId) {
    const c = cachedCustomers.find(x => x.customerId === customerId);
    if (!c) return toast('找不到客戶', 'error');
    document.getElementById('edit-rowIdx').value = c.rowIdx;
    document.getElementById('edit-customerId').value = c.customerId;
    document.getElementById('edit-name').value = c.name;
    document.getElementById('edit-fee').value = c.fee;
    document.getElementById('edit-startMonth').value = c.startMonth;
    document.getElementById('edit-payDate').value = c.payDate;
    document.getElementById('edit-active').value = c.active;
    document.getElementById('edit-giftDouType').value = c.giftDouType || '';
    document.getElementById('edit-note').value = c.note || '';
    document.getElementById('edit-modal').classList.add('active');
  }

  function closeEdit() {
    document.getElementById('edit-modal').classList.remove('active');
  }

  async function saveEdit() {
    const rowIdx = parseInt(document.getElementById('edit-rowIdx').value);
    const payload = {
      1: document.getElementById('edit-customerId').value.trim(),
      2: document.getElementById('edit-name').value.trim(),
      4: parseInt(document.getElementById('edit-fee').value),
      6: document.getElementById('edit-startMonth').value,
      8: document.getElementById('edit-payDate').value,
      12: document.getElementById('edit-active').value,
      13: document.getElementById('edit-giftDouType').value,
      14: document.getElementById('edit-note').value.trim()
    };
    try {
      const r = await api({
        action: 'updateRow', role: 'teacher', password: currentPassword,
        teacher: currentTeacher, sheetName: '02_包年合約台帳',
        row: rowIdx, payload: JSON.stringify(payload)
      });
      if (!r.ok) { toast(r.error || '更新失敗', 'error'); return; }
      toast('✓ 更新成功', 'success');
      closeEdit();
      loadSearch(document.getElementById('search-input').value);
    } catch (err) {
      toast('連線失敗：' + err.message, 'error');
    }
  }

  function confirmDelete(customerId, name, rowIdx) {
    if (!confirm('確定刪除「' + name + '（' + customerId + '）」？\n\n刪除後 01 表的贈年斗也會自動清除。\n此操作無法復原。')) return;
    deleteCustomer(rowIdx);
  }

  async function deleteCustomer(rowIdx) {
    try {
      const r = await api({
        action: 'deleteRow', role: 'teacher', password: currentPassword,
        teacher: currentTeacher, sheetName: '02_包年合約台帳', row: rowIdx
      });
      if (!r.ok) { toast(r.error || '刪除失敗', 'error'); return; }
      toast('✓ 已刪除', 'success');
      loadSearch(document.getElementById('search-input').value);
    } catch (err) {
      toast('連線失敗：' + err.message, 'error');
    }
  }

  function onFeeChange() {
    const fee = document.getElementById('bn-fee').value;
    document.getElementById('gift-dou-wrap').style.display = (fee === '4200') ? '' : 'none';
  }

  async function submitBaonian() {
    const data = {
      customerId: document.getElementById('bn-customerId').value.trim(),
      name: document.getElementById('bn-name').value.trim(),
      teacher: currentTeacher,
      fee: document.getElementById('bn-fee').value,
      startMonth: document.getElementById('bn-startMonth').value,
      payDate: document.getElementById('bn-payDate').value,
      giftDouType: document.getElementById('bn-giftDouType').value,
      note: document.getElementById('bn-note').value.trim()
    };
    if (!data.customerId || !data.name || !data.fee || !data.startMonth || !data.payDate) {
      return toast('請填寫必填欄位', 'error');
    }
    if (data.fee === '4200' && !data.giftDouType) {
      return toast('4200 包年必須選擇贈送年斗斗種', 'error');
    }
    const btn = document.getElementById('bn-submit');
    btn.disabled = true; btn.textContent = '新增中...';
    try {
      const r = await api({
        action: 'addBaonian', role: 'teacher', password: currentPassword,
        teacher: currentTeacher, payload: JSON.stringify(data)
      });
      if (!r.ok) { toast(r.error || '新增失敗', 'error'); return; }
      toast('✓ 新增成功', 'success');
      resetBaonianForm();
    } catch (err) {
      toast('連線失敗：' + err.message, 'error');
    } finally {
      btn.disabled = false; btn.textContent = '新 增 包 年';
    }
  }

  function resetBaonianForm() {
    ['bn-customerId', 'bn-name', 'bn-note'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('bn-fee').value = '';
    document.getElementById('bn-giftDouType').value = '';
    document.getElementById('gift-dou-wrap').style.display = 'none';
    setDefaultDates();
  }

  async function submitDoudeng() {
    const data = {
      customerId: document.getElementById('dd-customerId').value.trim(),
      name: document.getElementById('dd-name').value.trim(),
      teacher: currentTeacher,
      douType: document.getElementById('dd-douType').value,
      position: document.getElementById('dd-position').value.trim(),
      type: document.getElementById('dd-type').value,
      startMonth: document.getElementById('dd-startMonth').value,
      note: document.getElementById('dd-note').value.trim()
    };
    if (!data.name || !data.douType || !data.type || !data.startMonth) {
      return toast('請填寫必填欄位', 'error');
    }
    const btn = document.getElementById('dd-submit');
    btn.disabled = true; btn.textContent = '新增中...';
    try {
      const r = await api({
        action: 'addDoudeng', role: 'teacher', password: currentPassword,
        teacher: currentTeacher, payload: JSON.stringify(data)
      });
      if (!r.ok) { toast(r.error || '新增失敗', 'error'); return; }
      toast('✓ 新增成功（編號 ' + r.data.no + '）', 'success');
      resetDoudengForm();
    } catch (err) {
      toast('連線失敗：' + err.message, 'error');
    } finally {
      btn.disabled = false; btn.textContent = '新 增 斗 燈';
    }
  }

  function resetDoudengForm() {
    ['dd-customerId', 'dd-name', 'dd-position', 'dd-note'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('dd-douType').value = '';
    document.getElementById('dd-type').value = '';
    setDefaultDates();
  }

  // === API（連線到 Apps Script）===
  async function api(params) {
    const url = API_URL + '?' + new URLSearchParams(params).toString();
    const res = await fetch(url, { method: 'GET', redirect: 'follow' });
    return await res.json();
  }

  function esc(s) {
    if (s === undefined || s === null) return '';
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }
  function num(n) {
    if (!n) return '0';
    return Number(n).toLocaleString('zh-TW');
  }

  let toastTimer = null;
  function toast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast active ' + (type || '');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('active'), 3000);
  }
</script>
</body>
