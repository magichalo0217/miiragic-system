<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>斗燈系統 · 老師介面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-paper: #f5f0e6;
      --bg-card: #fffdf8;
      --bg-input: #fbf8f1;
      --ink: #2a2522;
      --ink-light: #6b6359;
      --ink-faint: #a89f93;
      --gold: #b8954e;
      --gold-deep: #8e7237;
      --crimson: #993333;
      --crimson-soft: #b85454;
      --line: #d8cdb8;
      --line-soft: #e8dfc9;
      --shadow: 0 1px 3px rgba(80, 60, 30, 0.08), 0 4px 12px rgba(80, 60, 30, 0.05);
    }
    body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg-paper); color: var(--ink); min-height: 100vh; font-size: 15px; line-height: 1.6; }
    .serif { font-family: 'Noto Serif TC', serif; }
    
    #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-card { width: 100%; max-width: 400px; background: var(--bg-card); padding: 48px 40px; box-shadow: var(--shadow); border-top: 3px solid var(--gold); }
    .login-title { font-family: 'Noto Serif TC', serif; font-size: 32px; font-weight: 600; letter-spacing: 4px; margin-bottom: 4px; }
    .login-subtitle { font-size: 13px; color: var(--ink-light); letter-spacing: 4px; margin-bottom: 32px; }
    .login-hint { font-size: 12px; color: var(--ink-faint); margin-top: 6px; }
    .form-label { display: block; font-size: 14px; color: var(--ink-light); margin-bottom: 8px; letter-spacing: 1px; }
    .form-input, .form-select { width: 100%; padding: 12px 16px; background: var(--bg-input); border: 1px solid var(--line); font-size: 15px; font-family: inherit; color: var(--ink); transition: border-color 0.15s; }
    .form-input:focus, .form-select:focus { outline: none; border-color: var(--gold); }
    .form-group { margin-bottom: 20px; }
    .btn { display: inline-block; padding: 12px 32px; background: var(--ink); color: var(--bg-card); border: none; font-family: inherit; font-size: 15px; letter-spacing: 4px; cursor: pointer; transition: background 0.15s; }
    .btn:hover { background: #444; }
    .btn-block { width: 100%; }
    .btn-gold { background: var(--gold); }
    .btn-gold:hover { background: var(--gold-deep); }
    .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .btn-ghost:hover { background: var(--bg-input); }
    .btn-sm { padding: 6px 16px; font-size: 13px; letter-spacing: 1px; }
    .error-msg { color: var(--crimson); font-size: 13px; margin-top: 12px; min-height: 20px; }
    
    #main-screen { display: none; }
    .topbar { background: var(--ink); color: var(--bg-paper); padding: 12px 32px; display: flex; justify-content: space-between; align-items: center; }
    .topbar-title { font-family: 'Noto Serif TC', serif; font-size: 16px; letter-spacing: 6px; }
    .topbar-right { display: flex; align-items: center; gap: 16px; font-size: 14px; }
    .logout-btn { padding: 4px 16px; border: 1px solid var(--gold); color: var(--gold); background: transparent; cursor: pointer; font-family: inherit; font-size: 13px; letter-spacing: 1px; }
    .logout-btn:hover { background: var(--gold); color: var(--ink); }
    
    .tabs { display: flex; background: var(--bg-card); border-bottom: 1px solid var(--line); padding: 0 32px; overflow-x: auto; }
    .tab { padding: 16px 24px; cursor: pointer; font-size: 15px; color: var(--ink-light); border-bottom: 2px solid transparent; transition: all 0.15s; white-space: nowrap; }
    .tab:hover { color: var(--ink); }
    .tab.active { color: var(--ink); border-bottom-color: var(--gold); font-weight: 500; }
    .tab-add { color: var(--crimson) !important; font-weight: 500; }
    .tab-add.active { border-bottom-color: var(--crimson); }
    
    .content { padding: 32px; max-width: 1200px; margin: 0 auto; }
    .panel { display: none; }
    .panel.active { display: block; }
    .panel-title { font-family: 'Noto Serif TC', serif; font-size: 22px; font-weight: 600; margin-bottom: 8px; }
    .panel-desc { color: var(--ink-light); font-size: 14px; margin-bottom: 24px; }
    .panel-desc .highlight { color: var(--gold-deep); font-weight: 500; }
    
    .card { background: var(--bg-card); padding: 32px; box-shadow: var(--shadow); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-grid-full { grid-column: 1 / -1; }
    @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
    .form-actions { margin-top: 24px; display: flex; gap: 12px; justify-content: flex-end; }
    
    .id-display { padding: 12px 16px; background: #fff5e0; border: 1px solid var(--gold); color: var(--gold-deep); font-family: 'Courier New', monospace; font-weight: 600; font-size: 16px; letter-spacing: 2px; }
    .id-display.loading { color: var(--ink-faint); font-family: inherit; font-style: italic; font-weight: normal; letter-spacing: normal; }
    
    .data-table { width: 100%; background: var(--bg-card); border-collapse: collapse; box-shadow: var(--shadow); }
    .data-table th, .data-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--line-soft); font-size: 14px; }
    .data-table th { background: var(--bg-input); font-weight: 600; color: var(--ink-light); font-size: 13px; letter-spacing: 1px; }
    .data-table tr:hover td { background: #faf6ec; }
    .data-table tr.clickable { cursor: pointer; }
    .data-table .no-data { text-align: center; padding: 48px; color: var(--ink-faint); }
    
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--bg-card); padding: 20px 24px; border-left: 3px solid var(--gold); }
    .stat-label { font-size: 13px; color: var(--ink-light); letter-spacing: 1px; margin-bottom: 6px; }
    .stat-value { font-family: 'Noto Serif TC', serif; font-size: 28px; font-weight: 600; }
    
    .month-picker-row { display: flex; gap: 16px; align-items: center; margin-bottom: 24px; padding: 16px 24px; background: var(--bg-card); box-shadow: var(--shadow); flex-wrap: wrap; }
    .month-picker-row label { font-size: 14px; color: var(--ink-light); white-space: nowrap; }
    .month-picker-row input { padding: 6px 12px; background: var(--bg-input); border: 1px solid var(--line); font-family: inherit; font-size: 14px; }
    
    .badge { display: inline-block; padding: 2px 10px; font-size: 12px; border-radius: 12px; letter-spacing: 1px; }
    .badge-active { background: #e8f0e0; color: #4a6e2e; }
    .badge-warn { background: #fff0e0; color: #b87737; }
    .badge-expire { background: #f0e0e0; color: var(--crimson); }
    .badge-info { background: #e0e8f0; color: #2e4a6e; }
    
    .toast { position: fixed; top: 24px; right: 24px; padding: 16px 24px; background: var(--ink); color: var(--bg-card); box-shadow: 0 4px 16px rgba(0,0,0,0.2); z-index: 100; max-width: 400px; transform: translateX(120%); transition: transform 0.3s ease; }
    .toast.show { transform: translateX(0); }
    .toast.success { background: #4a6e2e; }
    .toast.error { background: var(--crimson); }
    
    .copy-btn { padding: 4px 12px; font-size: 12px; background: var(--gold); color: white; border: none; cursor: pointer; font-family: inherit; letter-spacing: 1px; }
    .copy-btn:hover { background: var(--gold-deep); }
    
    .empty-hint { text-align: center; padding: 60px 24px; color: var(--ink-faint); background: var(--bg-card); }
    .empty-hint .big { font-family: 'Noto Serif TC', serif; font-size: 32px; color: var(--ink-light); margin-bottom: 12px; }
    
    /* Modal */
    .modal-bg { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; padding: 24px; }
    .modal-bg.show { display: flex; }
    .modal { background: var(--bg-card); max-width: 700px; width: 100%; padding: 32px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .modal-title { font-family: 'Noto Serif TC', serif; font-size: 22px; font-weight: 600; margin-bottom: 16px; }
    .modal-section { padding: 16px 0; border-top: 1px solid var(--line-soft); }
    .modal-section:first-of-type { border-top: none; }
    .modal-section-title { font-size: 14px; color: var(--ink-light); letter-spacing: 2px; margin-bottom: 12px; }
    
    .lamp-card { padding: 12px 16px; background: var(--bg-input); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .lamp-info { font-size: 14px; }
    .lamp-info strong { color: var(--gold-deep); font-family: 'Courier New', monospace; }
    .lamp-tokens { color: var(--gold-deep); font-size: 13px; margin-top: 4px; }
    .add-token-btn { padding: 4px 12px; font-size: 12px; background: var(--ink); color: var(--bg-card); border: none; cursor: pointer; font-family: inherit; letter-spacing: 1px; }
    .add-token-btn:hover { background: #444; }
  </style>
</head>
<body>
  <div id="login-screen">
    <div class="login-card">
      <h1 class="login-title">斗燈系統</h1>
      <p class="login-subtitle serif">老 師 介 面</p>
      <div class="form-group">
        <label class="form-label">選擇老師</label>
        <select id="teacher-select" class="form-select">
          <option value="">— 請選擇 —</option>
        </select>
        <p class="login-hint">每位老師皆有獨立編號</p>
      </div>
      <div class="form-group">
        <label class="form-label">密碼</label>
        <input type="password" id="password-input" class="form-input" placeholder="輸入密碼" autocomplete="off">
      </div>
      <button id="login-btn" class="btn btn-block">進　入</button>
      <p id="login-error" class="error-msg"></p>
    </div>
  </div>

  <div id="main-screen">
    <div class="topbar">
      <div class="topbar-title">斗 燈 ・ 老師介面</div>
      <div class="topbar-right">
        <span id="user-name">—</span>
        <button id="logout-btn" class="logout-btn">登出</button>
      </div>
    </div>

    <div class="tabs">
      <div class="tab tab-add active" data-panel="panel-add-baonian">＋ 新增包年</div>
      <div class="tab tab-add" data-panel="panel-add-doudeng">＋ 新增斗燈</div>
      <div class="tab" data-panel="panel-expiring">本月到期客戶</div>
      <div class="tab" data-panel="panel-search">客戶查詢</div>
    </div>

    <div class="content">
      <!-- 新增包年 -->
      <div id="panel-add-baonian" class="panel active">
        <h2 class="panel-title">新增包年合約</h2>
        <p class="panel-desc">所屬老師自動帶入「您」（<span class="highlight" id="hint-teacher-1">—</span>），客戶 ID 系統自動產生。</p>
        <div class="card">
          <div class="form-grid">
            <div class="form-group form-grid-full">
              <label class="form-label">客戶 ID（自動產生）</label>
              <div id="next-id-baonian" class="id-display loading">系統產生中…</div>
            </div>
            <div class="form-group form-grid-full">
              <label class="form-label">客戶姓名 *</label>
              <input type="text" id="bn-name" class="form-input" placeholder="王小明">
            </div>
            <div class="form-group">
              <label class="form-label">月費 *</label>
              <select id="bn-fee" class="form-select">
                <option value="">— 選擇 —</option>
                <option value="2100">2,100</option>
                <option value="3000">3,000</option>
                <option value="4200">4,200</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">起始月份 *</label>
              <input type="month" id="bn-start" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label">首付日期 *</label>
              <input type="date" id="bn-pay" class="form-input">
            </div>
            <div class="form-group" id="gift-group" style="display:none;">
              <label class="form-label">贈送年斗（4,200 月費限定）*</label>
              <select id="bn-gift" class="form-select">
                <option value="">— 選擇 —</option>
                <option value="財神斗">財神斗</option>
                <option value="化煞斗">化煞斗</option>
                <option value="貴人斗">貴人斗</option>
                <option value="開運斗">開運斗</option>
                <option value="姻緣斗">姻緣斗</option>
              </select>
            </div>
            <div class="form-group form-grid-full">
              <label class="form-label">備註</label>
              <textarea id="bn-note" class="form-input" rows="2" placeholder="可填特殊備註"></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn btn-ghost" onclick="resetBaonianForm()">清空</button>
            <button class="btn btn-gold" id="submit-baonian">新　增　包　年</button>
          </div>
        </div>
      </div>

      <!-- 新增斗燈 -->
      <div id="panel-add-doudeng" class="panel">
        <h2 class="panel-title">新增斗燈</h2>
        <p class="panel-desc">所屬老師自動帶入「您」（<span class="highlight" id="hint-teacher-2">—</span>），客戶 ID 系統自動產生。</p>
        <div class="card">
          <div class="form-grid">
            <div class="form-group form-grid-full">
              <label class="form-label">客戶 ID（自動產生）</label>
              <div id="next-id-doudeng" class="id-display loading">系統產生中…</div>
            </div>
            <div class="form-group form-grid-full">
              <label class="form-label">客戶姓名 *</label>
              <input type="text" id="dd-name" class="form-input" placeholder="王小明">
            </div>
            <div class="form-group">
              <label class="form-label">斗種 *</label>
              <select id="dd-doutype" class="form-select">
                <option value="">— 選擇 —</option>
                <option value="財神斗">財神斗</option>
                <option value="化煞斗">化煞斗</option>
                <option value="貴人斗">貴人斗</option>
                <option value="開運斗">開運斗</option>
                <option value="姻緣斗">姻緣斗</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">類型 *</label>
              <select id="dd-type" class="form-select">
                <option value="">— 選擇 —</option>
                <option value="年斗">年斗</option>
                <option value="季斗">季斗</option>
                <option value="奇門年斗">奇門年斗</option>
                <option value="奇門季斗">奇門季斗</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">架位編號</label>
              <input type="text" id="dd-position" class="form-input" placeholder="如 A-001">
            </div>
            <div class="form-group">
              <label class="form-label">安斗月份 *</label>
              <input type="month" id="dd-start" class="form-input">
            </div>
            <!-- 令牌欄(選填,所有斗皆可加購) -->
            <div class="form-group" id="lingpai-group">
              <label class="form-label">奇門令牌（選填，所有斗皆可加購）</label>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                <select id="dd-tiangan" class="form-select">
                  <option value="">— 天干 —</option>
                  <option value="甲">甲</option>
                  <option value="乙">乙</option>
                  <option value="丙">丙</option>
                  <option value="丁">丁</option>
                  <option value="戊">戊</option>
                  <option value="己">己</option>
                  <option value="庚">庚</option>
                  <option value="辛">辛</option>
                  <option value="壬">壬</option>
                  <option value="癸">癸</option>
                </select>
                <select id="dd-dizhi" class="form-select">
                  <option value="">— 地支 —</option>
                  <option value="子">子</option>
                  <option value="丑">丑</option>
                  <option value="寅">寅</option>
                  <option value="卯">卯</option>
                  <option value="辰">辰</option>
                  <option value="巳">巳</option>
                  <option value="午">午</option>
                  <option value="未">未</option>
                  <option value="申">申</option>
                  <option value="酉">酉</option>
                  <option value="戌">戌</option>
                  <option value="亥">亥</option>
                </select>
              </div>
            </div>
            <div class="form-group form-grid-full">
              <label class="form-label">備註</label>
              <textarea id="dd-note" class="form-input" rows="2" placeholder="可填特殊備註"></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn btn-ghost" onclick="resetDoudengForm()">清空</button>
            <button class="btn btn-gold" id="submit-doudeng">新　增　斗　燈</button>
          </div>
        </div>
      </div>

      <!-- 本月到期客戶 -->
      <div id="panel-expiring" class="panel">
        <h2 class="panel-title">本月到期客戶</h2>
        <p class="panel-desc">列出本月為合約最後一個月的客戶。請主動聯絡客戶安排續約。</p>
        <div class="month-picker-row">
          <label>查詢月份</label>
          <input type="month" id="expiring-month">
          <button class="btn btn-ghost btn-sm" onclick="loadExpiring()">查詢</button>
        </div>
        <div id="expiring-stats" class="stats-row" style="display:none;"></div>
        <div id="expiring-content"></div>
      </div>

      <!-- 客戶查詢 -->
      <div id="panel-search" class="panel">
        <h2 class="panel-title">客戶查詢</h2>
        <p class="panel-desc">查詢您的客戶。點選客戶可查看詳情、加購奇門令牌。</p>
        <div class="month-picker-row">
          <label>關鍵字</label>
          <input type="text" id="search-keyword" placeholder="客戶 ID 或姓名（留空查全部）" style="flex:1;">
          <button class="btn btn-ghost btn-sm" onclick="loadSearch()">查詢</button>
        </div>
        <div id="search-content"></div>
      </div>
    </div>
  </div>

  <!-- 客戶詳情 Modal（含加令牌） -->
  <div id="detail-modal" class="modal-bg">
    <div class="modal">
      <div class="modal-title" id="detail-title">客戶詳情</div>
      <div id="detail-body"></div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="closeDetailModal()">關閉</button>
      </div>
    </div>
  </div>

  <!-- 加令牌 Modal -->
  <div id="lingpai-modal" class="modal-bg">
    <div class="modal">
      <div class="modal-title">加購奇門令牌</div>
      <p class="panel-desc">為斗燈 <strong id="lingpai-target">D???</strong> 加購一個令牌</p>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">天干 *</label>
          <select id="lp-tiangan" class="form-select">
            <option value="">— 選擇 —</option>
            <option value="甲">甲</option><option value="乙">乙</option><option value="丙">丙</option>
            <option value="丁">丁</option><option value="戊">戊</option><option value="己">己</option>
            <option value="庚">庚</option><option value="辛">辛</option><option value="壬">壬</option>
            <option value="癸">癸</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">地支 *</label>
          <select id="lp-dizhi" class="form-select">
            <option value="">— 選擇 —</option>
            <option value="子">子</option><option value="丑">丑</option><option value="寅">寅</option>
            <option value="卯">卯</option><option value="辰">辰</option><option value="巳">巳</option>
            <option value="午">午</option><option value="未">未</option><option value="申">申</option>
            <option value="酉">酉</option><option value="戌">戌</option><option value="亥">亥</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="closeLingpaiModal()">取消</button>
        <button class="btn btn-gold" onclick="submitLingpai()">加　購　令　牌</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbzz9zWTST80TjzeYfc7S_8FbXAGjYbUu8QtJgu9Mf3WclA32pgF_WNHDyr9fXujKbov/exec';
  
  let currentTeacher = '';
  let currentPassword = '';
  let teachersList = [];  // 從 API 拿到的老師清單（含編號）
  let currentLingpaiTarget = '';
  
  async function api(params) {
    const url = API_URL + '?' + new URLSearchParams(params).toString();
    const res = await fetch(url, { method: 'GET', redirect: 'follow' });
    return await res.json();
  }
  
  function authedApi(params) {
    return api(Object.assign({ role: 'teacher', password: currentPassword, teacher: currentTeacher }, params));
  }
  
  function esc(s) {
    if (s === undefined || s === null) return '';
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }
  
  function num(n) { if (!n) return '0'; return Number(n).toLocaleString(); }
  
  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + (type || '');
    setTimeout(() => t.classList.remove('show'), 3000);
  }
  
  function todayMonth() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }
  function todayDate() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  
  // ========== 啟動：載入老師清單 ==========
  async function initLogin() {
    const sel = document.getElementById('teacher-select');
    try {
      // 不需密碼也能取，但 API 要求 role
      const url = API_URL + '?action=getTeacherListWithIndex&role=teacher&password=anything&teacher=anything';
      const res = await fetch(url).then(r => r.json());
      // 拿不到也沒關係，用內建預設清單
      let arr = (res && res.ok && res.data) ? res.data : null;
      if (!arr) {
        arr = [
          {name:'陳捷容',abbr:'CJR'},{name:'蕭竣方',abbr:'HJF'},{name:'陳彩綺',abbr:'CCQ'},
          {name:'周冠榮',abbr:'ZGR'},{name:'沈佳琪',abbr:'SJQ'},{name:'羅文勳',abbr:'LWX'},
          {name:'蕭鎧峻',abbr:'HKJ'},{name:'鐘宥涵',abbr:'ZYH'},{name:'湯雯莉',abbr:'TWL'},
          {name:'謝承殷',abbr:'XCY'},{name:'林雅涵',abbr:'LYH'},{name:'陳昕昀',abbr:'CXY'},
          {name:'熊卿妃',abbr:'XQF'},{name:'朱沛語',abbr:'ZPY'},{name:'靈應壇+員工',abbr:'LYT'},
          {name:'賴素貞',abbr:'LSZ'},{name:'張簡玉靖',abbr:'ZJYJ'},{name:'梁凱妍',abbr:'LKY'},
          {name:'鄭聖勳',abbr:'ZSX'},{name:'王宥心',abbr:'WYX'}
        ];
      }
      teachersList = arr;
      arr.forEach((t, i) => {
        const opt = document.createElement('option');
        opt.value = t.name;
        opt.textContent = (i + 1) + '. ' + t.name;
        sel.appendChild(opt);
      });
    } catch (e) {
      console.error(e);
    }
    
    document.getElementById('login-btn').addEventListener('click', doLogin);
    document.getElementById('password-input').addEventListener('keypress', e => {
      if (e.key === 'Enter') doLogin();
    });
  }
  
  async function doLogin() {
    const teacher = document.getElementById('teacher-select').value;
    const password = document.getElementById('password-input').value;
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';
    
    if (!teacher) { errEl.textContent = '請選擇老師'; return; }
    if (!password) { errEl.textContent = '請輸入密碼'; return; }
    
    try {
      const res = await api({ action: 'login', role: 'teacher', password: password, teacher: teacher });
      if (!res.ok) { errEl.textContent = res.error || '登入失敗'; return; }
      currentTeacher = teacher;
      currentPassword = password;
      enterMain();
    } catch (e) {
      errEl.textContent = '連線失敗：' + e.message;
    }
  }
  
  function enterMain() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'block';
    document.getElementById('user-name').textContent = currentTeacher;
    document.getElementById('hint-teacher-1').textContent = currentTeacher;
    document.getElementById('hint-teacher-2').textContent = currentTeacher;
    
    document.getElementById('bn-start').value = todayMonth();
    document.getElementById('bn-pay').value = todayDate();
    document.getElementById('dd-start').value = todayMonth();
    document.getElementById('expiring-month').value = todayMonth();
    
    refreshNextId();
    
    document.getElementById('bn-fee').addEventListener('change', e => {
      document.getElementById('gift-group').style.display = (e.target.value === '4200') ? 'block' : 'none';
      if (e.target.value !== '4200') document.getElementById('bn-gift').value = '';
    });
    
    // 令牌欄一律顯示, 所有斗都可加購
    
    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        document.getElementById(t.dataset.panel).classList.add('active');
        if (t.dataset.panel === 'panel-expiring') loadExpiring();
        if (t.dataset.panel === 'panel-search') loadSearch();
      });
    });
    
    document.getElementById('submit-baonian').addEventListener('click', submitBaonian);
    document.getElementById('submit-doudeng').addEventListener('click', submitDoudeng);
    document.getElementById('logout-btn').addEventListener('click', () => location.reload());
  }
  
  async function refreshNextId() {
    const elBn = document.getElementById('next-id-baonian');
    const elDd = document.getElementById('next-id-doudeng');
    elBn.className = 'id-display loading'; elBn.textContent = '系統產生中…';
    elDd.className = 'id-display loading'; elDd.textContent = '系統產生中…';
    try {
      const res = await authedApi({ action: 'getNextCustomerId' });
      if (res.ok && res.data && res.data.nextId) {
        elBn.className = 'id-display'; elBn.textContent = res.data.nextId;
        elDd.className = 'id-display'; elDd.textContent = res.data.nextId;
      } else {
        elBn.textContent = elDd.textContent = '產生失敗';
      }
    } catch (e) {
      elBn.textContent = elDd.textContent = '連線失敗';
    }
  }
  
  // ========== 新增包年 ==========
  function resetBaonianForm() {
    document.getElementById('bn-name').value = '';
    document.getElementById('bn-fee').value = '';
    document.getElementById('bn-start').value = todayMonth();
    document.getElementById('bn-pay').value = todayDate();
    document.getElementById('bn-gift').value = '';
    document.getElementById('bn-note').value = '';
    document.getElementById('gift-group').style.display = 'none';
  }
  
  async function submitBaonian() {
    const name = document.getElementById('bn-name').value.trim();
    const fee = document.getElementById('bn-fee').value;
    const start = document.getElementById('bn-start').value;
    const pay = document.getElementById('bn-pay').value;
    const gift = document.getElementById('bn-gift').value;
    const note = document.getElementById('bn-note').value.trim();
    
    if (!name) { showToast('請填客戶姓名', 'error'); return; }
    if (!fee) { showToast('請選月費', 'error'); return; }
    if (!start) { showToast('請選起始月份', 'error'); return; }
    if (!pay) { showToast('請選首付日期', 'error'); return; }
    if (fee === '4200' && !gift) { showToast('4,200 月費需選贈送年斗', 'error'); return; }
    
    const btn = document.getElementById('submit-baonian');
    btn.disabled = true; btn.textContent = '處 理 中…';
    
    try {
      const payload = { teacher: currentTeacher, name, fee, startMonth: start, payDate: pay, giftDouType: gift, note };
      const res = await authedApi({ action: 'addBaonian', payload: JSON.stringify(payload) });
      if (res.ok) {
        showToast('新增成功！客戶 ID：' + (res.data && res.data.customerId || '-'), 'success');
        resetBaonianForm();
        refreshNextId();
      } else {
        showToast('新增失敗：' + (res.error || ''), 'error');
      }
    } catch (e) {
      showToast('連線失敗：' + e.message, 'error');
    } finally {
      btn.disabled = false; btn.textContent = '新　增　包　年';
    }
  }
  
  // ========== 新增斗燈 ==========
  function resetDoudengForm() {
    document.getElementById('dd-name').value = '';
    document.getElementById('dd-doutype').value = '';
    document.getElementById('dd-type').value = '';
    document.getElementById('dd-position').value = '';
    document.getElementById('dd-start').value = todayMonth();
    document.getElementById('dd-note').value = '';
    document.getElementById('dd-tiangan').value = '';
    document.getElementById('dd-dizhi').value = '';
  }
  
  async function submitDoudeng() {
    const name = document.getElementById('dd-name').value.trim();
    const douType = document.getElementById('dd-doutype').value;
    const type = document.getElementById('dd-type').value;
    const position = document.getElementById('dd-position').value.trim();
    const start = document.getElementById('dd-start').value;
    const note = document.getElementById('dd-note').value.trim();
    const tiangan = document.getElementById('dd-tiangan').value;
    const dizhi = document.getElementById('dd-dizhi').value;
    
    if (!name) { showToast('請填客戶姓名', 'error'); return; }
    if (!douType) { showToast('請選斗種', 'error'); return; }
    if (!type) { showToast('請選類型', 'error'); return; }
    if (!start) { showToast('請選安斗月份', 'error'); return; }
    
    // 令牌選填 — 但若選了天干或地支其中一個就要兩個都選
    if ((tiangan && !dizhi) || (!tiangan && dizhi)) {
      showToast('令牌需同時選天干與地支', 'error');
      return;
    }
    const lingpai = (tiangan && dizhi) ? (tiangan + dizhi) : '';
    
    const btn = document.getElementById('submit-doudeng');
    btn.disabled = true; btn.textContent = '處 理 中…';
    
    try {
      const payload = { teacher: currentTeacher, name, douType, type, position, startMonth: start, note, lingpai };
      const res = await authedApi({ action: 'addDoudeng', payload: JSON.stringify(payload) });
      if (res.ok) {
        showToast('新增斗燈成功！編號：' + (res.data && res.data.no), 'success');
        resetDoudengForm();
        refreshNextId();
      } else {
        showToast('新增失敗：' + (res.error || ''), 'error');
      }
    } catch (e) {
      showToast('連線失敗：' + e.message, 'error');
    } finally {
      btn.disabled = false; btn.textContent = '新　增　斗　燈';
    }
  }
  
  // ========== 本月到期 ==========
  async function loadExpiring() {
    const month = document.getElementById('expiring-month').value;
    if (!month) return;
    
    const content = document.getElementById('expiring-content');
    content.innerHTML = '<div class="empty-hint">載入中...</div>';
    document.getElementById('expiring-stats').style.display = 'none';
    
    try {
      const res = await authedApi({ action: 'getExpiringCustomers', month: month });
      if (!res.ok) {
        content.innerHTML = '<div class="empty-hint">查詢失敗：' + esc(res.error || '') + '</div>';
        return;
      }
      const customers = (res.data && res.data.customers) || [];
      
      const stats = document.getElementById('expiring-stats');
      stats.style.display = 'grid';
      stats.innerHTML = `
        <div class="stat-card">
          <div class="stat-label">到期客戶數</div>
          <div class="stat-value">${customers.length}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">查詢月份</div>
          <div class="stat-value" style="font-size:20px;">${month}</div>
        </div>
      `;
      
      if (customers.length === 0) {
        content.innerHTML = `<div class="empty-hint"><div class="big">無到期客戶</div>本月沒有合約到期的客戶</div>`;
        return;
      }
      
      let html = '<table class="data-table"><thead><tr><th>客戶 ID</th><th>姓名</th><th>月費</th><th>起始</th><th>到期</th><th>贈年斗</th><th>聯絡</th></tr></thead><tbody>';
      customers.forEach(c => {
        const msg = `${c.name} 您好，您的包年於 ${c.endMonth} 到期，邀請您續報。— ${currentTeacher}`;
        html += `<tr>
          <td><strong>${esc(c.customerId)}</strong></td>
          <td>${esc(c.name)}</td>
          <td>${num(c.fee)}</td>
          <td>${esc(c.startMonth)}</td>
          <td><span class="badge badge-expire">${esc(c.endMonth)}</span></td>
          <td>${esc(c.giftDouType)}</td>
          <td><button class="copy-btn" onclick="copyMsg('${esc(msg)}')">複製通知</button></td>
        </tr>`;
      });
      html += '</tbody></table>';
      content.innerHTML = html;
    } catch (e) {
      content.innerHTML = '<div class="empty-hint">連線失敗：' + esc(e.message) + '</div>';
    }
  }
  
  function copyMsg(msg) {
    const ta = document.createElement('textarea');
    ta.value = msg;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('已複製通知模板', 'success');
  }
  
  // ========== 客戶查詢 ==========
  async function loadSearch() {
    const keyword = document.getElementById('search-keyword').value.trim();
    const content = document.getElementById('search-content');
    content.innerHTML = '<div class="empty-hint">載入中...</div>';
    
    try {
      const res = await authedApi({ action: 'searchCustomer', keyword: keyword });
      if (!res.ok) { content.innerHTML = '<div class="empty-hint">查詢失敗</div>'; return; }
      // 過濾「全撤+無包年」、「未生效」 — 只看實際有在燃的
      const customers = ((res.data && res.data.customers) || []).filter(c => {
        const activeLamps = (c.lamps || []).filter(l => l.retired !== '是').length;
        // 至少有一顆在燃,或有生效中包年
        return activeLamps > 0 || c.active === '是';
      });
      
      if (customers.length === 0) {
        content.innerHTML = `<div class="empty-hint"><div class="big">無資料</div>沒有符合條件的客戶</div>`;
        return;
      }
      
      let html = '<table class="data-table"><thead><tr><th>客戶 ID</th><th>姓名</th><th>包年狀態</th><th>在燃</th><th>已撤</th><th>令牌</th></tr></thead><tbody>';
      customers.forEach(c => {
        // 包年狀態三種
        const lamps = c.lamps || [];
        const activeLamps = lamps.filter(l => l.retired !== '是').length;
        const retiredLamps = lamps.filter(l => l.retired === '是').length;
        const lingpaiCount = lamps.filter(l => l.lingpai).length;
        
        let baonianBadge;
        if (c.active === '是') {
          baonianBadge = '<span class="badge badge-active">🟢 包年生效</span>';
        } else if (c.fee || c.startMonth) {
          // 有包年資料但 active 不是「是」 = 已過期
          baonianBadge = '<span class="badge badge-warn">⚪ 包年到期</span>';
        } else {
          baonianBadge = '<span style="color:var(--ink-faint);">— 無包年</span>';
        }
        
        html += `<tr class="clickable" onclick="openCustomerDetail('${esc(c.customerId)}')">
          <td><strong>${esc(c.customerId)}</strong></td>
          <td>${esc(c.name)}</td>
          <td>${baonianBadge}</td>
          <td>${activeLamps > 0 ? '<strong style="color:var(--gold-deep);">'+activeLamps+' 顆</strong>' : '<span style="color:var(--ink-faint);">—</span>'}</td>
          <td>${retiredLamps > 0 ? retiredLamps + ' 顆' : '<span style="color:var(--ink-faint);">—</span>'}</td>
          <td>${lingpaiCount > 0 ? '<span style="color:var(--gold-deep);">🪙 '+lingpaiCount+'</span>' : '<span style="color:var(--ink-faint);">—</span>'}</td>
        </tr>`;
      });
      html += '</tbody></table><p style="margin-top:12px; color:var(--ink-faint); font-size:13px;">💡 點選客戶可查看詳情、加購奇門令牌</p>';
      content.innerHTML = html;
    } catch (e) {
      content.innerHTML = '<div class="empty-hint">連線失敗：' + esc(e.message) + '</div>';
    }
  }
  
  // ========== 客戶詳情 + 令牌 ==========
  async function openCustomerDetail(customerId) {
    document.getElementById('detail-modal').classList.add('show');
    document.getElementById('detail-title').textContent = '客戶詳情：' + customerId;
    document.getElementById('detail-body').innerHTML = '<div class="empty-hint">載入中...</div>';
    
    try {
      const res = await authedApi({ action: 'getCustomerDetail', customerId: customerId });
      if (!res.ok) {
        document.getElementById('detail-body').innerHTML = '<div class="empty-hint">查詢失敗</div>';
        return;
      }
      const data = res.data || {};
      const bn = data.baonian;
      const lamps = data.lamps || [];
      
      let html = '';
      
      if (bn) {
        const status = bn.active === '是' 
          ? '<span class="badge badge-active">生效</span>' 
          : '<span class="badge badge-warn">未生效</span>';
        html += `<div class="modal-section">
          <div class="modal-section-title">包年合約</div>
          <p><strong>${esc(bn.name)}</strong> ・ 月費 ${num(bn.fee)} ・ ${esc(bn.startMonth)} ~ ${esc(bn.endMonth)} ${status}</p>
          <p style="font-size:13px; color:var(--ink-light); margin-top:4px;">萬寶 ${num(bn.wbj)} / 天赦 ${num(bn.tsj)} ${bn.giftDouType ? '・贈 '+esc(bn.giftDouType) : ''}</p>
        </div>`;
      }
      
      html += '<div class="modal-section"><div class="modal-section-title">斗燈紀錄（' + lamps.length + ' 盞）</div>';
      if (lamps.length === 0) {
        html += '<p style="color:var(--ink-faint);">該客戶尚無斗燈紀錄</p>';
      } else {
        lamps.forEach(l => {
          const isQimen = (l.type === '奇門年斗' || l.type === '奇門季斗');
          const retiredBadge = l.retired === '是' 
            ? '<span class="badge badge-warn">已撤</span>' 
            : '<span class="badge badge-active">在斗</span>';
          html += `<div class="lamp-card">
            <div class="lamp-info">
              <strong>${esc(l.no)}</strong> ・ ${esc(l.douType)} ${esc(l.type)} 
              ${l.position ? '・架位 '+esc(l.position) : ''} 
              ・${esc(l.startMonth)}~${esc(l.endMonth)} ${retiredBadge}
              ${l.lingpai ? '<div class="lamp-tokens">🪙 令牌：'+esc(l.lingpai)+'</div>' : ''}
            </div>
            ${l.retired !== '是' ? '<button class="add-token-btn" onclick="openLingpaiModal(\''+esc(l.no)+'\')">+ 加購令牌</button>' : ''}
          </div>`;
        });
      }
      html += '</div>';
      
      document.getElementById('detail-body').innerHTML = html;
    } catch (e) {
      document.getElementById('detail-body').innerHTML = '<div class="empty-hint">連線失敗：' + esc(e.message) + '</div>';
    }
  }
  
  function closeDetailModal() {
    document.getElementById('detail-modal').classList.remove('show');
  }
  
  // ========== 加購令牌 ==========
  function openLingpaiModal(no) {
    currentLingpaiTarget = no;
    document.getElementById('lingpai-target').textContent = no;
    document.getElementById('lp-tiangan').value = '';
    document.getElementById('lp-dizhi').value = '';
    document.getElementById('lingpai-modal').classList.add('show');
  }
  
  function closeLingpaiModal() {
    document.getElementById('lingpai-modal').classList.remove('show');
    currentLingpaiTarget = '';
  }
  
  async function submitLingpai() {
    const tiangan = document.getElementById('lp-tiangan').value;
    const dizhi = document.getElementById('lp-dizhi').value;
    if (!tiangan || !dizhi) { showToast('請選天干與地支', 'error'); return; }
    
    try {
      const payload = { no: currentLingpaiTarget, tiangan, dizhi };
      const res = await authedApi({ action: 'addLingpai', payload: JSON.stringify(payload) });
      if (res.ok) {
        showToast('已加購令牌：' + tiangan + dizhi, 'success');
        closeLingpaiModal();
        // 詳情視窗保留，重整
        const cid = document.getElementById('detail-title').textContent.replace('客戶詳情：', '');
        if (cid) openCustomerDetail(cid);
      } else {
        showToast('加購失敗：' + (res.error || ''), 'error');
      }
    } catch (e) {
      showToast('連線失敗：' + e.message, 'error');
    }
  }
  
  // ========== 啟動 ==========
  initLogin();
  </script>
</body>
